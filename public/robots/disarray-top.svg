<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Top-down Disarray: forks + white discs at +X -->
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a98b8"/>
      <stop offset="100%" stop-color="#9ad4e8"/>
    </linearGradient>
  </defs>

  <ellipse cx="48" cy="82" rx="34" ry="7" fill="#000" opacity="0.4"/>

  <!-- body -->
  <path d="M14 28 L48 18 L58 78 L18 72 Z" fill="url(#teal)" stroke="#1a4050"/>
  <!-- orange stripe / name hint -->
  <path d="M22 40 L40 34" stroke="#e87820" stroke-width="2" stroke-linecap="round"/>
  <!-- top panels -->
  <rect x="28" y="36" width="8" height="10" rx="1" fill="#2a6a88"/>
  <rect x="38" y="34" width="9" height="12" rx="1" fill="#2a6a88"/>
  <rect x="30" y="50" width="8" height="10" rx="1" fill="#2a6a88"/>
  <circle cx="32" cy="40" r="1.5" fill="#e87820"/>
  <circle cx="42" cy="39" r="1.8" fill="#e87820"/>

  <!-- wheels -->
  <circle cx="26" cy="36" r="7" fill="#0a0a0e"/>
  <circle cx="26" cy="36" r="3" fill="#a8b0bc"/>
  <circle cx="28" cy="58" r="7" fill="#0a0a0e"/>
  <circle cx="28" cy="58" r="3" fill="#a8b0bc"/>

  <!-- crest hint -->
  <rect x="36" y="42" width="4" height="12" fill="#6eb8d4"/>

  <!-- forks -->
  <path d="M55 26 L92 18 L90 24 L58 30 Z" fill="#6eb8d4" stroke="#1a4050"/>
  <path d="M55 36 L82 32 L80 38 L56 40 Z" fill="#5aa8c4" stroke="#1a4050"/>
  <path d="M55 52 L82 58 L80 64 L56 58 Z" fill="#5aa8c4" stroke="#1a4050"/>
  <path d="M55 64 L92 76 L88 82 L54 70 Z" fill="#6eb8d4" stroke="#1a4050"/>

  <!-- dual white discs (narrow from top) -->
  <ellipse cx="68" cy="48" rx="7" ry="22" fill="#e8eef4" stroke="#6a7380"/>
  <ellipse cx="74" cy="48" rx="6" ry="20" fill="#ffffff" stroke="#5a6270"/>
  <ellipse cx="71" cy="48" rx="2" ry="6" fill="#3a4250"/>
  <!-- scallop nubs -->
  <circle cx="68" cy="28" r="2.5" fill="#fff" stroke="#7a8490"/>
  <circle cx="68" cy="68" r="2.5" fill="#fff" stroke="#7a8490"/>
  <circle cx="74" cy="30" r="2.2" fill="#fff" stroke="#7a8490"/>
  <circle cx="74" cy="66" r="2.2" fill="#fff" stroke="#7a8490"/>
</svg>
