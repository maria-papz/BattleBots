<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" fill="none">
  <!--
    Death Roll — clear reference match (3/4 view, facing right):
      forest green + mustard camo wedge, croc snout,
      white bloody teeth, red eye, green arm+knife,
      left treaded wheels, right red vertical saw + black forks
  -->
  <defs>
    <linearGradient id="disc" x1="0.2" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5562"/>
      <stop offset="50%" stop-color="#c81020"/>
      <stop offset="100%" stop-color="#5a0810"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0b8c4"/>
      <stop offset="100%" stop-color="#3a4250"/>
    </linearGradient>
  </defs>

  <ellipse cx="215" cy="282" rx="150" ry="14" fill="#000" opacity="0.3"/>

  <!-- undercarriage -->
  <path d="M80 210 L230 185 L300 205 L285 245 L95 248 Z" fill="#0c0e12" stroke="#000" stroke-width="1.5"/>

  <!-- ===== CAMO BODY (forest green base) ===== -->
  <path id="hull" d="M55 180
           L78 115
           L155 85
           L255 88
           L320 120
           L335 160
           L310 200
           L220 225
           L105 228
           L60 205 Z"
        fill="#3a6e35" stroke="#0a1008" stroke-width="2.5"/>

  <!-- mustard camo patches (large, like reference) -->
  <path d="M85 140 L130 110 L165 125 L148 165 L95 170 Z" fill="#d4a82e"/>
  <path d="M150 100 L210 92 L240 118 L215 150 L155 145 Z" fill="#e0b83a"/>
  <path d="M185 150 L250 135 L280 155 L260 190 L195 192 Z" fill="#c99828"/>
  <path d="M230 105 L285 112 L312 142 L290 168 L240 150 Z" fill="#d4a82e"/>
  <path d="M75 175 L120 160 L140 188 L110 208 L78 200 Z" fill="#e0b83a"/>
  <path d="M155 185 L205 175 L225 205 L180 218 L150 208 Z" fill="#d4a82e"/>
  <path d="M255 160 L300 152 L320 175 L295 195 L250 188 Z" fill="#e0b83a"/>
  <!-- green islands -->
  <path d="M175 115 L205 110 L215 132 L185 138 Z" fill="#3a6e35"/>
  <path d="M245 128 L275 124 L285 145 L255 150 Z" fill="#2f5c2c"/>
  <path d="M105 150 L128 145 L135 165 L110 170 Z" fill="#2f5c2c"/>

  <!-- re-stroke hull -->
  <path d="M55 180 L78 115 L155 85 L255 88 L320 120 L335 160 L310 200 L220 225 L105 228 L60 205 Z"
        fill="none" stroke="#050805" stroke-width="2"/>

  <!-- croc snout toward disc -->
  <path d="M295 115 L350 130 L358 165 L330 178 L300 160 Z"
        fill="#3a6e35" stroke="#050805" stroke-width="2"/>
  <path d="M310 125 L340 138 L335 158 L312 152 Z" fill="#d4a82e"/>
  <circle cx="345" cy="142" r="3.5" fill="#050805"/>

  <!-- wheel bay -->
  <path d="M70 160 L150 130 L162 195 L85 218 Z" fill="#101410" stroke="#050805"/>

  <!-- treaded wheels -->
  <ellipse cx="108" cy="185" rx="32" ry="32" fill="#0a0a0e" stroke="#000" stroke-width="2"/>
  <ellipse cx="108" cy="185" rx="25" ry="25" fill="#18181e"/>
  <g stroke="#333340" stroke-width="3" stroke-linecap="square">
    <path d="M108 155 v8"/><path d="M130 163 l-5 5"/><path d="M139 185 h-8"/>
    <path d="M130 207 l-5 -5"/><path d="M108 215 v-8"/><path d="M86 207 l5 -5"/>
    <path d="M77 185 h8"/><path d="M86 163 l5 5"/>
  </g>
  <ellipse cx="108" cy="185" rx="11" ry="11" fill="url(#rim)"/>
  <ellipse cx="108" cy="185" rx="4.5" ry="4.5" fill="#2a2a34"/>

  <ellipse cx="142" cy="172" rx="28" ry="28" fill="#0a0a0e" stroke="#000" stroke-width="2"/>
  <ellipse cx="142" cy="172" rx="21" ry="21" fill="#18181e"/>
  <g stroke="#333340" stroke-width="2.5" stroke-linecap="square">
    <path d="M142 146 v7"/><path d="M161 153 l-4 4"/><path d="M168 172 h-7"/>
    <path d="M161 191 l-4 -4"/><path d="M142 198 v-7"/><path d="M123 191 l4 -4"/>
    <path d="M116 172 h7"/><path d="M123 153 l4 4"/>
  </g>
  <ellipse cx="142" cy="172" rx="9" ry="9" fill="url(#rim)"/>
  <ellipse cx="142" cy="172" rx="3.5" ry="3.5" fill="#2a2a34"/>

  <!-- red eye -->
  <ellipse cx="215" cy="122" rx="13" ry="9" fill="#1a0608" stroke="#000" stroke-width="1.5"/>
  <ellipse cx="217" cy="122" rx="9" ry="6.5" fill="#e01424"/>
  <ellipse cx="220" cy="119" rx="3" ry="2.2" fill="#ffc0c8"/>

  <!-- BIG teeth (must read at select size) -->
  <path d="M280 168 L298 168 L289 210 Z" fill="#f8f8f8" stroke="#111" stroke-width="1"/>
  <path d="M300 172 L320 172 L310 218 Z" fill="#f4f4f4" stroke="#111" stroke-width="1"/>
  <path d="M322 174 L344 174 L333 222 Z" fill="#f8f8f8" stroke="#111" stroke-width="1"/>
  <path d="M346 172 L365 172 L355 208 Z" fill="#f0f0f0" stroke="#111" stroke-width="1"/>
  <path d="M305 202 L315 202 L310 218 Z" fill="#e01424"/>
  <path d="M328 205 L338 205 L333 222 Z" fill="#ff2030"/>
  <path d="M350 196 L360 196 L355 208 Z" fill="#c01020"/>

  <!-- green arm + knife (prominent) -->
  <path d="M145 95 C165 55 215 40 260 55 C280 65 288 82 285 98"
        fill="none" stroke="#1a4024" stroke-width="14" stroke-linecap="round"/>
  <path d="M145 95 C165 55 215 40 260 55 C280 65 288 82 285 98"
        fill="none" stroke="#4a9a48" stroke-width="8" stroke-linecap="round"/>
  <circle cx="185" cy="62" r="5" fill="#d4a82e"/>
  <circle cx="230" cy="48" r="4.5" fill="#d4a82e"/>
  <ellipse cx="285" cy="98" rx="10" ry="9" fill="#3a6e35" stroke="#0a1008" stroke-width="1.5"/>
  <ellipse cx="288" cy="95" rx="3.5" ry="3" fill="#e01424"/>
  <!-- knife -->
  <path d="M292 88 L360 70 L366 82 L302 106 Z" fill="#c0c8d4" stroke="#3a4250" stroke-width="1.3"/>
  <path d="M296 86 L352 72 L355 80 L300 96 Z" fill="#fff" opacity="0.4"/>
  <path d="M318 78 L324 70 L327 80" fill="none" stroke="#5a6270" stroke-width="1.2"/>
  <path d="M332 75 L338 67 L341 77" fill="none" stroke="#5a6270" stroke-width="1.2"/>
  <rect x="280" y="94" width="16" height="9" rx="1.5" fill="#3a4250"/>

  <!-- black forks -->
  <path d="M300 215 L430 238 L410 260 L288 238 Z" fill="#0a0a0e" stroke="#000" stroke-width="1.5"/>
  <path d="M285 235 L415 275 L390 295 L270 252 Z" fill="#08080c" stroke="#000" stroke-width="1.5"/>
  <path d="M330 188 L385 202 L370 228 L320 210 Z" fill="#0a0a0e" stroke="#000"/>

  <!--
    Red vertical saw — PARTIAL arc only (not a full circle).
    Open/cut side faces left into the jaws; outer rim has jagged teeth.
  -->
  <g transform="translate(368 148)">
    <!-- thick crescent body (~240°), open toward mouth (left) -->
    <path d="M -18 -72
             C 8 -92 38 -80 48 -40
             C 56 -8 54 28 44 58
             C 32 86 8 96 -16 78
             L -8 58
             C 10 72 28 62 36 38
             C 44 12 46 -8 40 -34
             C 32 -62 10 -72 -10 -58
             Z"
          fill="url(#disc)" stroke="#3a060c" stroke-width="2"/>
    <!-- darker inner face of the arc -->
    <path d="M -12 -55
             C 6 -70 28 -60 36 -30
             C 42 -4 40 24 32 48
             C 22 68 4 74 -10 60
             L -4 48
             C 8 58 22 52 28 32
             C 34 10 36 -4 30 -26
             C 24 -48 6 -56 -6 -46
             Z"
          fill="#8a0c18" opacity="0.55"/>
    <!-- axle stub where blade enters mouth (left cut edge) -->
    <ellipse cx="-14" cy="4" rx="7" ry="16" fill="#2a2a34" stroke="#111" stroke-width="1"/>
    <ellipse cx="-14" cy="4" rx="3" ry="7" fill="#8a93a0"/>

    <!-- jagged teeth only on the visible outer rim -->
    <g fill="#e82030" stroke="#5a0810" stroke-width="0.6">
      <path d="M 6 -78 L 18 -102 L -2 -88 Z"/>
      <path d="M 28 -68 L 48 -90 L 30 -54 Z"/>
      <path d="M 42 -42 L 68 -58 L 48 -28 Z"/>
      <path d="M 50 -12 L 78 -18 L 54 6 Z"/>
      <path d="M 50 18 L 78 28 L 52 36 Z"/>
      <path d="M 42 48 L 68 68 L 44 62 Z"/>
      <path d="M 24 70 L 42 96 L 14 82 Z"/>
      <path d="M 2 82 L 12 108 L -12 90 Z"/>
      <path d="M -14 72 L -8 96 L -24 78 Z"/>
    </g>
  </g>
</svg>
