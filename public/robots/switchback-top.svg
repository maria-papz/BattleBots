<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Top-down Switchback (+X = lattice forks / flipper) -->
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c05008"/>
      <stop offset="100%" stop-color="#ff9a28"/>
    </linearGradient>
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0a0e"/>
      <stop offset="100%" stop-color="#2a2a30"/>
    </linearGradient>
    <pattern id="hazard" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#f07810"/>
      <path d="M0 0 L6 6 M6 0 L0 6" stroke="#ffffff" stroke-width="2"/>
    </pattern>
  </defs>

  <ellipse cx="48" cy="86" rx="34" ry="5" fill="#000" opacity="0.38"/>

  <!-- wheels -->
  <circle cx="22" cy="28" r="7" fill="#121218" stroke="#0a0a0e"/>
  <circle cx="22" cy="28" r="3.5" fill="url(#orange)"/>
  <circle cx="22" cy="68" r="7" fill="#121218" stroke="#0a0a0e"/>
  <circle cx="22" cy="68" r="3.5" fill="url(#orange)"/>
  <circle cx="48" cy="72" r="6" fill="#121218" stroke="#0a0a0e"/>
  <circle cx="48" cy="72" r="3" fill="url(#orange)"/>

  <!-- chassis -->
  <path d="M16 30 L52 22 L58 74 L20 70 Z" fill="url(#black)" stroke="#0a0a0e" stroke-width="1.3"/>
  <rect x="28" y="36" width="18" height="28" rx="2" fill="#121218" stroke="#0a0a0e"/>
  <rect x="30" y="38" width="14" height="8" fill="url(#hazard)"/>

  <!-- flipper arm -->
  <path d="M52 34 L78 28 L82 48 L58 52 Z" fill="#121218" stroke="#0a0a0e" stroke-width="1.2"/>
  <rect x="60" y="36" width="14" height="8" rx="1" fill="#0a0a0e"/>
  <rect x="62" y="39" width="10" height="2" fill="#2a2a32"/>

  <!-- lattice forks -->
  <path d="M58 28 L92 18 L90 26 L62 34 Z" fill="#121218" stroke="#0a0a0e"/>
  <path d="M58 48 L88 58 L86 66 L60 58 Z" fill="#121218" stroke="#0a0a0e"/>
  <path d="M62 30 L86 22" stroke="#2a2a30" stroke-width="1"/>
  <path d="M64 32 L84 26" stroke="#2a2a30" stroke-width="1"/>
  <path d="M62 50 L84 58" stroke="#2a2a30" stroke-width="1"/>
  <path d="M64 54 L82 62" stroke="#2a2a30" stroke-width="1"/>
  <path d="M86 22 L94 20 L90 26 Z" fill="#0a0a0e"/>
  <path d="M84 58 L92 62 L86 66 Z" fill="#0a0a0e"/>

  <!-- orange lightning hint -->
  <path d="M34 46 L38 46 L36 50 L40 50 L34 56 L36 52 L32 52 Z" fill="url(#orange)"/>
</svg>
