<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Top-down Nemesis (+X = forks / spinner) -->
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a01828"/>
      <stop offset="100%" stop-color="#ff4858"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a87810"/>
      <stop offset="100%" stop-color="#ffe860"/>
    </linearGradient>
  </defs>

  <ellipse cx="48" cy="86" rx="34" ry="5" fill="#000" opacity="0.38"/>

  <!-- body -->
  <path d="M18 32 L52 24 L58 70 L22 68 Z" fill="#121218" stroke="#0a0a0e" stroke-width="1.3"/>
  <path d="M26 36 L48 30 L52 64 L30 66 Z" fill="#1a1a22" stroke="#0a0a0e"/>
  <path d="M32 40 L46 36 L48 52 L34 54 Z" fill="url(#red)" opacity="0.75" stroke="#801018"/>
  <!-- sunburst hint -->
  <circle cx="40" cy="44" r="6" fill="url(#gold)" stroke="#0a0a0e"/>
  <circle cx="40" cy="44" r="2" fill="#d02838"/>

  <!-- overhead arm -->
  <rect x="36" y="42" width="18" height="4" rx="1" fill="#121218" stroke="#0a0a0e"/>
  <ellipse cx="58" cy="44" rx="5" ry="12" fill="url(#red)" stroke="#801018" stroke-width="1.2"/>
  <path d="M58 32 L62 40 L58 44 L54 40 Z" fill="#ff4858"/>

  <!-- four forks -->
  <path d="M58 28 L88 20 L86 26 L60 32 Z" fill="#121218" stroke="#0a0a0e"/>
  <path d="M58 36 L86 32 L84 38 L60 40 Z" fill="#121218" stroke="#0a0a0e"/>
  <path d="M58 48 L84 52 L82 58 L60 54 Z" fill="#121218" stroke="#0a0a0e"/>
  <path d="M58 58 L82 64 L80 70 L60 64 Z" fill="#121218" stroke="#0a0a0e"/>
  <path d="M86 20 L92 18 L88 24 Z" fill="url(#gold)"/>
  <path d="M84 32 L90 30 L86 36 Z" fill="url(#gold)"/>
  <path d="M82 52 L88 54 L84 58 Z" fill="url(#gold)"/>
  <path d="M80 64 L86 68 L82 72 Z" fill="url(#gold)"/>
</svg>
