<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" fill="none">
  <!--
    Nemesis from reference (3/4 front-left):
      black wedge, red flames, gold sunburst,
      four hinged forks, overhead red vertical spinner
  -->
  <defs>
    <linearGradient id="black" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="55%" stop-color="#121218"/>
      <stop offset="100%" stop-color="#0a0a0e"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4858"/>
      <stop offset="50%" stop-color="#d02838"/>
      <stop offset="100%" stop-color="#a01828"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#ffe860"/>
      <stop offset="45%" stop-color="#e0b020"/>
      <stop offset="100%" stop-color="#a87810"/>
    </linearGradient>
  </defs>

  <ellipse cx="240" cy="318" rx="165" ry="14" fill="#000" opacity="0.35"/>

  <!-- chassis -->
  <path d="M90 220 L160 165 L310 155 L350 200 L320 255 L130 265 L80 240 Z"
        fill="url(#black)" stroke="#0a0a0e" stroke-width="2"/>
  <path d="M160 165 L310 155 L330 185 L190 205 Z" fill="#1a1a22" stroke="#0a0a0e"/>
  <!-- red flames -->
  <path d="M170 175 L230 168 L240 195 L185 205 Z" fill="url(#red)" stroke="#801018" stroke-width="1.2"/>
  <path d="M250 170 L310 165 L300 198 L255 200 Z" fill="url(#red)" stroke="#801018" stroke-width="1.2"/>
  <path d="M185 205 L255 200 L245 225 L175 230 Z" fill="#a01828" opacity="0.65"/>

  <!-- gold sunburst on deck -->
  <g transform="translate(210 148)">
    <circle cx="0" cy="0" r="18" fill="url(#gold)" stroke="#0a0a0e" stroke-width="1.2"/>
    <path d="M0 -16 L2 -6 L0 0 L-2 -6 Z" fill="#fff8d0"/>
    <path d="M14 -8 L6 -2 L0 0 L6 2 Z" fill="#fff8d0"/>
    <path d="M0 16 L2 6 L0 0 L-2 6 Z" fill="#fff8d0"/>
    <path d="M-14 8 L-6 2 L0 0 L-6 -2 Z" fill="#fff8d0"/>
    <path d="M10 12 L4 4 L0 0 L-4 4 Z" fill="#fff8d0"/>
    <path d="M-10 12 L-4 4 L0 0 L4 4 Z" fill="#fff8d0"/>
    <circle cx="0" cy="0" r="4" fill="#d02838"/>
  </g>

  <!-- gold fan plate on side -->
  <path d="M145 188 L165 178 L168 198 L148 208 Z" fill="url(#gold)" stroke="#0a0a0e" stroke-width="1.2"/>
  <circle cx="156" cy="193" r="4" fill="#d02838"/>

  <!-- overhead arm -->
  <g transform="translate(235 88)">
    <path d="M0 95 L8 55 L18 55 L26 95 Z" fill="url(#black)" stroke="#0a0a0e" stroke-width="1.5"/>
    <path d="M26 95 L34 55 L44 55 L52 95 Z" fill="url(#black)" stroke="#0a0a0e" stroke-width="1.5"/>
    <path d="M10 70 L16 58 L22 70 Z" fill="#1a1a22"/>
    <path d="M30 70 L36 58 L42 70 Z" fill="#1a1a22"/>
    <path d="M8 55 L44 55 L38 42 L14 42 Z" fill="#121218" stroke="#0a0a0e"/>
    <!-- gold arm badge -->
    <path d="M0 78 L12 72 L14 88 L2 92 Z" fill="url(#gold)" stroke="#0a0a0e"/>
    <circle cx="7" cy="82" r="2.5" fill="#d02838"/>
    <!-- arm extension -->
    <path d="M26 42 L70 18 L78 38 L40 58 Z" fill="url(#black)" stroke="#0a0a0e" stroke-width="2"/>
    <path d="M34 46 L62 28 L68 40 L42 54 Z" fill="#1a1a22"/>
    <!-- red vertical spinner -->
    <ellipse cx="82" cy="28" rx="12" ry="28" fill="url(#red)" stroke="#801018" stroke-width="2"/>
    <path d="M82 0 L92 18 L82 28 L72 18 Z" fill="#ff4858" stroke="#801018"/>
    <circle cx="82" cy="28" r="4" fill="#0a0a0e"/>
  </g>

  <!-- four hinged forks -->
  <g fill="url(#black)" stroke="#0a0a0e" stroke-width="1.5">
    <path d="M330 200 L395 188 L398 198 L335 212 Z"/>
    <path d="M335 212 L398 198 L402 208 L338 222 Z"/>
    <path d="M340 222 L402 208 L405 218 L342 232 Z"/>
    <path d="M345 232 L405 218 L408 228 L348 242 Z"/>
  </g>
  <g fill="url(#gold)" stroke="#a87810" stroke-width="1">
    <path d="M393 186 L405 184 L398 198 Z"/>
    <path d="M400 206 L412 204 L405 218 Z"/>
    <path d="M403 216 L415 214 L408 228 Z"/>
    <path d="M406 226 L418 224 L412 238 L400 236 Z"/>
  </g>
  <!-- fork hinges -->
  <circle cx="330" cy="200" r="4" fill="#2a2a30" stroke="#0a0a0e"/>
  <circle cx="335" cy="212" r="4" fill="#2a2a30" stroke="#0a0a0e"/>
  <circle cx="340" cy="222" r="4" fill="#2a2a30" stroke="#0a0a0e"/>
  <circle cx="345" cy="232" r="4" fill="#2a2a30" stroke="#0a0a0e"/>
</svg>
