<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Top-down Witch Doctor (+X = skull / forks) -->
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78c818"/>
      <stop offset="100%" stop-color="#d8ff60"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#502080"/>
      <stop offset="100%" stop-color="#b868f0"/>
    </linearGradient>
  </defs>

  <ellipse cx="48" cy="86" rx="34" ry="5" fill="#000" opacity="0.38"/>

  <!-- wheels -->
  <circle cx="20" cy="30" r="7" fill="#121218" stroke="#0a0a0e"/>
  <circle cx="20" cy="30" r="3" fill="url(#green)"/>
  <circle cx="20" cy="66" r="7" fill="#121218" stroke="#0a0a0e"/>
  <circle cx="20" cy="66" r="3" fill="url(#green)"/>
  <circle cx="48" cy="72" r="6" fill="#121218" stroke="#0a0a0e"/>
  <circle cx="48" cy="72" r="2.5" fill="url(#green)"/>

  <!-- chassis -->
  <path d="M18 32 L52 24 L58 70 L22 68 Z" fill="#121218" stroke="#0a0a0e" stroke-width="1.3"/>
  <!-- rib hints -->
  <path d="M28 38 Q32 34 36 38" fill="none" stroke="#8030c8" stroke-width="1.2"/>
  <path d="M34 36 Q38 32 42 36" fill="none" stroke="#8030c8" stroke-width="1.2"/>
  <path d="M40 38 Q44 34 48 38" fill="none" stroke="#8030c8" stroke-width="1.2"/>
  <ellipse cx="32" cy="40" rx="3" ry="5" fill="#f0e8c8" stroke="#8030c8"/>
  <ellipse cx="42" cy="40" rx="3" ry="5" fill="#f0e8c8" stroke="#8030c8"/>

  <!-- green flame corners -->
  <path d="M24 44 L30 40 L32 48 Z" fill="url(#green)" stroke="#0a0a0e"/>
  <path d="M46 40 L52 44 L48 50 Z" fill="url(#green)" stroke="#0a0a0e"/>

  <!-- skull spinner (narrow from top) -->
  <ellipse cx="68" cy="48" rx="8" ry="16" fill="#ffffff" stroke="#0a0a0e" stroke-width="1.2"/>
  <ellipse cx="66" cy="44" rx="2" ry="3" fill="#0a0a0e"/>
  <ellipse cx="70" cy="44" rx="2" ry="3" fill="#0a0a0e"/>
  <path d="M64 54 Q68 58 72 54" fill="none" stroke="#0a0a0e" stroke-width="1"/>
  <rect x="64" y="46" width="8" height="4" fill="url(#purple)"/>

  <!-- forks -->
  <path d="M58 30 L88 24 L86 32 L60 36 Z" fill="#121218" stroke="#0a0a0e"/>
  <path d="M58 48 L86 52 L84 60 L60 56 Z" fill="#121218" stroke="#0a0a0e"/>
  <path d="M58 62 L84 68 L82 76 L60 70 Z" fill="#0a0a0e" stroke="#0a0a0e"/>
</svg>
