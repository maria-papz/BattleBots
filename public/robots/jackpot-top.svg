<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Top-down Jackpot: +X front = twin hearts, aft = srimech forks, striped wedges -->
  <defs>
    <linearGradient id="grn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#145820"/>
      <stop offset="100%" stop-color="#62d050"/>
    </linearGradient>
    <linearGradient id="hrt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#500810"/>
      <stop offset="50%" stop-color="#e01828"/>
      <stop offset="100%" stop-color="#ff7080"/>
    </linearGradient>
    <pattern id="vstripe" width="5" height="28" patternUnits="userSpaceOnUse">
      <rect width="2.5" height="28" fill="#e01828"/>
      <rect x="2.5" width="2.5" height="28" fill="#06060a"/>
    </pattern>
  </defs>

  <ellipse cx="48" cy="88" rx="36" ry="5" fill="#000" opacity="0.38"/>

  <!-- red wheels aft -->
  <circle cx="20" cy="32" r="8.5" fill="#c01020" stroke="#400810"/>
  <circle cx="20" cy="32" r="3.5" fill="#300810"/>
  <circle cx="20" cy="64" r="8.5" fill="#c01020" stroke="#400810"/>
  <circle cx="20" cy="64" r="3.5" fill="#300810"/>

  <!-- green body -->
  <path d="M14 28 L48 20 L54 76 L20 72 Z" fill="url(#grn)" stroke="#0c3814" stroke-width="1.5"/>
  <circle cx="28" cy="40" r="1.7" fill="#c8d0dc"/>
  <circle cx="34" cy="52" r="1.7" fill="#c8d0dc"/>
  <circle cx="30" cy="64" r="1.7" fill="#c8d0dc"/>

  <!-- striped wedges -->
  <path d="M42 24 L72 18 L70 46 L44 48 Z" fill="url(#vstripe)" stroke="#040406" stroke-width="1.3"/>
  <path d="M44 50 L72 52 L68 78 L46 74 Z" fill="url(#vstripe)" stroke="#040406" stroke-width="1.3"/>

  <!-- green mounts -->
  <rect x="56" y="36" width="10" height="24" rx="1" fill="#2f9a38" stroke="#0c3814"/>

  <!-- twin hearts as vertical discs (top-down = ellipses) -->
  <ellipse cx="80" cy="38" rx="8" ry="14" fill="url(#hrt)" stroke="#400810" stroke-width="1.3"/>
  <ellipse cx="80" cy="60" rx="8" ry="14" fill="url(#hrt)" stroke="#400810" stroke-width="1.3"/>
  <ellipse cx="80" cy="49" rx="3" ry="8" fill="#c8d0dc" stroke="#3a4250"/>
  <circle cx="64" cy="34" r="3.2" fill="#e01828"/>

  <!-- srimech rods aft -->
  <path d="M32 42 L24 12" stroke="#06060a" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M40 44 L50 10" stroke="#06060a" stroke-width="3.2" stroke-linecap="round"/>
  <rect x="28" y="38" width="9" height="5" rx="1" fill="#c89828"/>
  <rect x="38" y="40" width="9" height="5" rx="1" fill="#c89828"/>
  <!-- two-prong tips -->
  <path d="M20 14 L24 4 L26 14" fill="#e01828"/>
  <path d="M24 14 L28 3 L30 14" fill="#e01828"/>
  <path d="M46 12 L50 2 L52 12" fill="#e01828"/>
  <path d="M50 12 L54 1 L56 12" fill="#e01828"/>
</svg>
