<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" fill="none">
  <!--
    The Twins from reference:
      trapezoid white faces, bored eyes, purple top blocks,
      center spine, dark prongs, twin front + 3/4 views
  -->
  <defs>
    <linearGradient id="purple" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#e060c0"/>
      <stop offset="45%" stop-color="#c848a8"/>
      <stop offset="100%" stop-color="#903070"/>
    </linearGradient>
    <linearGradient id="gray" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#4a4a54"/>
      <stop offset="55%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#121218"/>
    </linearGradient>
  </defs>

  <ellipse cx="240" cy="318" rx="165" ry="14" fill="#000" opacity="0.35"/>

  <!-- twin A — front view -->
  <g transform="translate(88 62)">
    <!-- rear hull -->
    <path d="M18 128 L0 102 L12 58 L88 58 L104 102 L86 128 Z"
          fill="url(#gray)" stroke="#0a0a0e" stroke-width="2"/>
    <rect x="10" y="96" width="78" height="26" rx="2" fill="#1a1a22" stroke="#0a0a0e"/>

    <!-- purple shoulder blocks -->
    <path d="M16 58 L36 40 L50 58 Z" fill="url(#purple)" stroke="#0a0a0e" stroke-width="1.8"/>
    <path d="M50 58 L70 40 L84 58 Z" fill="url(#purple)" stroke="#0a0a0e" stroke-width="1.8"/>
    <rect x="46" y="40" width="10" height="20" fill="#2a2a30" stroke="#0a0a0e"/>

    <!-- white trapezoid face -->
    <path d="M14 102 L38 74 L66 74 L90 102 L90 128 L14 128 Z"
          fill="#ffffff" stroke="#0a0a0e" stroke-width="2.2"/>
    <rect x="48" y="74" width="8" height="56" fill="#2a2a30" stroke="#0a0a0e" stroke-width="1.5"/>

    <!-- bored eyes -->
    <rect x="22" y="86" width="18" height="16" rx="3" fill="#ffffff" stroke="#0a0a0e" stroke-width="1.8"/>
    <rect x="56" y="86" width="18" height="16" rx="3" fill="#ffffff" stroke="#0a0a0e" stroke-width="1.8"/>
    <rect x="24" y="94" width="14" height="8" rx="2" fill="#0a0a0e"/>
    <rect x="58" y="94" width="14" height="8" rx="2" fill="#0a0a0e"/>
    <rect x="22" y="86" width="18" height="6" rx="2" fill="#ffffff" stroke="#0a0a0e" stroke-width="1"/>
    <rect x="56" y="86" width="18" height="6" rx="2" fill="#ffffff" stroke="#0a0a0e" stroke-width="1"/>

    <!-- prongs -->
    <path d="M24 128 L20 158 L30 158 L34 128 Z" fill="#2a2a30" stroke="#0a0a0e" stroke-width="1.8"/>
    <path d="M58 128 L54 158 L64 158 L68 128 Z" fill="#2a2a30" stroke="#0a0a0e" stroke-width="1.8"/>
  </g>

  <!-- twin B — 3/4 view -->
  <g transform="translate(248 48)">
    <!-- depth hull -->
    <path d="M42 138 L12 110 L28 52 L118 62 L136 108 L108 142 Z"
          fill="#121218" stroke="#0a0a0e" stroke-width="2"/>
    <path d="M108 142 L136 108 L152 118 L124 152 Z" fill="#0a0a0e"/>
    <rect x="26" y="104" width="84" height="32" rx="2" fill="#1a1a22" stroke="#0a0a0e"/>

    <!-- side motor port -->
    <rect x="98" y="114" width="18" height="10" rx="2" fill="#2a2a30" stroke="#0a0a0e" stroke-width="1.5"/>
    <circle cx="107" cy="119" r="3.5" fill="#0a0a0e"/>

    <!-- purple top -->
    <path d="M32 52 L54 34 L68 52 Z" fill="url(#purple)" stroke="#0a0a0e" stroke-width="1.8"/>
    <path d="M64 54 L88 36 L102 54 Z" fill="url(#purple)" stroke="#0a0a0e" stroke-width="1.8"/>
    <rect x="64" y="36" width="10" height="22" fill="#2a2a30" stroke="#0a0a0e"/>

    <!-- face -->
    <path d="M24 110 L54 78 L84 78 L114 110 L114 136 L24 136 Z"
          fill="#ffffff" stroke="#0a0a0e" stroke-width="2.2"/>
    <rect x="66" y="78" width="8" height="60" fill="#2a2a30" stroke="#0a0a0e" stroke-width="1.5"/>

    <!-- eyes -->
    <rect x="32" y="94" width="18" height="16" rx="3" fill="#ffffff" stroke="#0a0a0e" stroke-width="1.8"/>
    <rect x="66" y="94" width="18" height="16" rx="3" fill="#ffffff" stroke="#0a0a0e" stroke-width="1.8"/>
    <rect x="34" y="102" width="14" height="8" rx="2" fill="#0a0a0e"/>
    <rect x="68" y="102" width="14" height="8" rx="2" fill="#0a0a0e"/>
    <rect x="32" y="94" width="18" height="6" rx="2" fill="#ffffff" stroke="#0a0a0e" stroke-width="1"/>
    <rect x="66" y="94" width="18" height="6" rx="2" fill="#ffffff" stroke="#0a0a0e" stroke-width="1"/>

    <!-- prongs -->
    <path d="M36 136 L32 162 L42 162 L46 136 Z" fill="#2a2a30" stroke="#0a0a0e" stroke-width="1.8"/>
    <path d="M70 136 L66 162 L76 162 L80 136 Z" fill="#2a2a30" stroke="#0a0a0e" stroke-width="1.8"/>

    <!-- tread -->
    <rect x="8" y="118" width="10" height="22" rx="2" fill="#2a2a30" stroke="#0a0a0e"/>
    <rect x="10" y="122" width="6" height="4" fill="#0a0a0e"/>
    <rect x="10" y="130" width="6" height="4" fill="#0a0a0e"/>
  </g>
</svg>
