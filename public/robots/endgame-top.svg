<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Top-down End Game: orange wedges + blue spinner at +X -->
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c05008"/>
      <stop offset="100%" stop-color="#ff9a28"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e3a78"/>
      <stop offset="100%" stop-color="#3a7ec8"/>
    </linearGradient>
  </defs>

  <ellipse cx="48" cy="82" rx="34" ry="7" fill="#000" opacity="0.4"/>

  <!-- black body -->
  <path d="M14 30 L48 22 L52 74 L18 70 Z" fill="#1a1c22" stroke="#050508"/>
  <!-- deck -->
  <path d="M22 36 L46 30 L48 58 L24 62 Z" fill="#d0ccc4" stroke="#5a5248"/>
  <path d="M28 40 L40 36 L42 48 L30 50 Z" fill="#c87830" opacity="0.5"/>
  <!-- fins -->
  <path d="M40 32 L46 24 L48 34 Z" fill="#0a0a0e"/>
  <path d="M34 34 L38 26 L40 36 Z" fill="#121218"/>

  <!-- wheels -->
  <circle cx="24" cy="38" r="7" fill="#0a0a0e"/>
  <circle cx="24" cy="38" r="3" fill="#a8b0bc"/>
  <circle cx="26" cy="58" r="7" fill="#0a0a0e"/>
  <circle cx="26" cy="58" r="3" fill="#a8b0bc"/>

  <!-- orange wedges -->
  <path d="M48 28 L78 22 L76 44 L50 46 Z" fill="url(#orange)" stroke="#8a3808"/>
  <path d="M50 48 L78 52 L74 74 L48 68 Z" fill="url(#orange)" stroke="#8a3808"/>
  <!-- END on upper wedge -->
  <g fill="#ffffff" transform="translate(52 32) scale(0.28)">
    <rect x="0" y="0" width="5" height="32"/><rect x="0" y="0" width="18" height="6"/><rect x="0" y="13" width="14" height="6"/><rect x="0" y="26" width="18" height="6"/>
    <rect x="24" y="0" width="5" height="32"/><polygon points="29,0 34,0 43,32 38,32"/><rect x="43" y="0" width="5" height="32"/>
    <rect x="54" y="0" width="5" height="32"/><path d="M59 0 H72 C80 0 84 6 84 16 C84 26 80 32 72 32 H59 V26 H70 C74 26 76 22 76 16 C76 10 74 6 70 6 H59 Z"/>
  </g>
  <!-- GAME on lower wedge -->
  <g fill="#ffffff" transform="translate(52 56) scale(0.22)">
    <path d="M0 6 C0 2 4 0 10 0 H22 V6 H12 C8 6 6 8 6 16 C6 24 8 26 12 26 H18 V18 H12 V12 H24 V32 H10 C4 32 0 28 0 16 Z"/>
    <polygon points="30,32 36,0 42,0 48,32 42,32 40.5,24 37.5,24 36,32"/><rect x="37" y="14" width="5.5" height="5"/>
    <rect x="54" y="0" width="5" height="32"/><polygon points="59,0 64,0 69,18 74,0 79,0 79,6 73,32 68,32 69,18 65,32 60,32 59,6"/><rect x="79" y="0" width="5" height="32"/>
    <rect x="90" y="0" width="5" height="32"/><rect x="90" y="0" width="18" height="6"/><rect x="90" y="13" width="14" height="6"/><rect x="90" y="26" width="18" height="6"/>
  </g>

  <!-- blue spinner -->
  <rect x="62" y="38" width="8" height="20" rx="1" fill="url(#blue)"/>
  <ellipse cx="70" cy="48" rx="6" ry="18" fill="#9aa3b0" stroke="#3a4250"/>
  <ellipse cx="70" cy="48" rx="2" ry="5" fill="#2a3038"/>
  <circle cx="70" cy="30" r="2.5" fill="#f0c020"/>
  <circle cx="70" cy="66" r="2.5" fill="#f0c020"/>
  <circle cx="78" cy="40" r="2" fill="#f0c020"/>
  <circle cx="78" cy="56" r="2" fill="#f0c020"/>

  <!-- srimech hint -->
  <rect x="44" y="44" width="4" height="10" fill="#1e5aa0"/>
</svg>
