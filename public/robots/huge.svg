<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" fill="none">
  <!--
    HUGE from reference (3/4):
      twin giant white spoke wheels with black tires,
      dual white chassis pods on grey axle,
      vertical bar spinner (blue core to gold tips) with spin rings,
      twin angry blue eyes on the pods
  -->
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0c020"/>
      <stop offset="35%" stop-color="#3a6ec8"/>
      <stop offset="65%" stop-color="#2a58b0"/>
      <stop offset="100%" stop-color="#f0c020"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d0d6e0"/>
      <stop offset="100%" stop-color="#5a6270"/>
    </linearGradient>
    <linearGradient id="whiteBox" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e8ecf2"/>
      <stop offset="100%" stop-color="#b0b8c4"/>
    </linearGradient>
  </defs>

  <ellipse cx="240" cy="318" rx="170" ry="14" fill="#000" opacity="0.28"/>

  <!-- LEFT GIANT WHEEL -->
  <g transform="translate(95 165)">
    <ellipse cx="0" cy="0" rx="78" ry="78" fill="#0a0a0e" stroke="#111" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="68" ry="68" fill="#f2f4f8" stroke="#8a93a0" stroke-width="2"/>
    <g stroke="#c0c8d4" stroke-width="10" stroke-linecap="round">
      <path d="M0 -52 L0 52"/>
      <path d="M-45 -26 L45 26"/>
      <path d="M-45 26 L45 -26"/>
    </g>
    <g stroke="#a8b0bc" stroke-width="4" stroke-linecap="round">
      <path d="M0 -52 L0 52"/>
      <path d="M-45 -26 L45 26"/>
      <path d="M-45 26 L45 -26"/>
    </g>
    <ellipse cx="0" cy="0" rx="16" ry="16" fill="url(#steel)" stroke="#3a4250"/>
    <ellipse cx="0" cy="0" rx="7" ry="7" fill="#2a3038"/>
  </g>

  <!-- RIGHT GIANT WHEEL -->
  <g transform="translate(385 165)">
    <ellipse cx="0" cy="0" rx="78" ry="78" fill="#0a0a0e" stroke="#111" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="68" ry="68" fill="#f2f4f8" stroke="#8a93a0" stroke-width="2"/>
    <g stroke="#c0c8d4" stroke-width="10" stroke-linecap="round">
      <path d="M0 -52 L0 52"/>
      <path d="M-45 -26 L45 26"/>
      <path d="M-45 26 L45 -26"/>
    </g>
    <g stroke="#a8b0bc" stroke-width="4" stroke-linecap="round">
      <path d="M0 -52 L0 52"/>
      <path d="M-45 -26 L45 26"/>
      <path d="M-45 26 L45 -26"/>
    </g>
    <ellipse cx="0" cy="0" rx="16" ry="16" fill="url(#steel)" stroke="#3a4250"/>
    <ellipse cx="0" cy="0" rx="7" ry="7" fill="#2a3038"/>
  </g>

  <!-- axle -->
  <rect x="20" y="158" width="440" height="14" rx="4" fill="url(#steel)" stroke="#3a4250"/>
  <rect x="20" y="160" width="440" height="4" fill="#fff" opacity="0.25"/>

  <!-- LEFT POD -->
  <path d="M155 130 L230 125 L235 195 L160 200 L150 160 Z"
        fill="url(#whiteBox)" stroke="#5a6270" stroke-width="2"/>
  <path d="M150 160 L160 200 L235 195 L228 170 Z" fill="#a8b0bc" stroke="#5a6270"/>
  <circle cx="165" cy="140" r="3" fill="#5a6270"/>
  <circle cx="220" cy="138" r="3" fill="#5a6270"/>
  <circle cx="168" cy="185" r="3" fill="#5a6270"/>
  <circle cx="222" cy="182" r="3" fill="#5a6270"/>
  <!-- angry blue eye on left pod -->
  <g transform="translate(192 155)">
    <path d="M-22 -8 L24 -12 L20 2 L-18 6 Z" fill="#1a3050"/>
    <ellipse cx="0" cy="8" rx="18" ry="14" fill="#1a3050"/>
    <ellipse cx="2" cy="9" rx="13" ry="10" fill="#2a58b0"/>
    <ellipse cx="4" cy="8" rx="6" ry="6" fill="#0a1020"/>
    <ellipse cx="6" cy="6" rx="2.2" ry="2.2" fill="#fff"/>
  </g>

  <!-- RIGHT POD -->
  <path d="M250 125 L330 130 L335 160 L325 200 L255 195 L248 160 Z"
        fill="url(#whiteBox)" stroke="#5a6270" stroke-width="2"/>
  <path d="M325 200 L335 160 L330 130 L340 155 L332 205 Z" fill="#a8b0bc" stroke="#5a6270"/>
  <circle cx="260" cy="138" r="3" fill="#5a6270"/>
  <circle cx="315" cy="140" r="3" fill="#5a6270"/>
  <circle cx="262" cy="182" r="3" fill="#5a6270"/>
  <circle cx="318" cy="185" r="3" fill="#5a6270"/>
  <!-- angry blue eye on right pod top -->
  <g transform="translate(288 155)">
    <path d="M-22 -8 L24 -12 L20 2 L-18 6 Z" fill="#1a3050"/>
    <ellipse cx="0" cy="8" rx="18" ry="14" fill="#1a3050"/>
    <ellipse cx="2" cy="9" rx="13" ry="10" fill="#2a58b0"/>
    <ellipse cx="4" cy="8" rx="6" ry="6" fill="#0a1020"/>
    <ellipse cx="6" cy="6" rx="2.2" ry="2.2" fill="#fff"/>
  </g>
  <!-- angry blue eye on side face -->
  <g transform="translate(328 155)">
    <path d="M-12 -2 L14 -6 L12 2 L-10 4 Z" fill="#1a3050"/>
    <ellipse cx="0" cy="8" rx="14" ry="12" fill="#1a3050"/>
    <ellipse cx="2" cy="8" rx="10" ry="8" fill="#2a58b0"/>
    <ellipse cx="4" cy="7" rx="4" ry="4" fill="#0a1020"/>
    <ellipse cx="5" cy="6" rx="1.5" ry="1.5" fill="#fff"/>
  </g>

  <!-- VERTICAL BAR SPINNER -->
  <ellipse cx="240" cy="160" rx="28" ry="28" fill="none" stroke="#6aa0e8" stroke-width="3" opacity="0.35"/>
  <ellipse cx="240" cy="160" rx="40" ry="40" fill="none" stroke="#6aa0e8" stroke-width="2" opacity="0.22"/>
  <ellipse cx="240" cy="160" rx="52" ry="52" fill="none" stroke="#8ab8f0" stroke-width="1.5" opacity="0.15"/>
  <rect x="230" y="55" width="20" height="210" rx="6" fill="url(#bar)" stroke="#1a3050" stroke-width="1.5"/>
  <rect x="234" y="60" width="6" height="200" fill="#fff" opacity="0.2"/>
  <rect x="230" y="55" width="20" height="28" rx="6" fill="#f0c020"/>
  <rect x="230" y="237" width="20" height="28" rx="6" fill="#f0c020"/>
  <rect x="234" y="58" width="6" height="20" fill="#ffe86a" opacity="0.5"/>
  <rect x="234" y="242" width="6" height="18" fill="#ffe86a" opacity="0.5"/>
  <ellipse cx="240" cy="160" rx="12" ry="12" fill="#1a3050"/>
  <ellipse cx="240" cy="160" rx="6" ry="6" fill="#c8d0dc"/>
</svg>
