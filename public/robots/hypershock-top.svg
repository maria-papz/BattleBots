<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Top-down Hypershock -->
  <defs>
    <linearGradient id="yel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8a808"/>
      <stop offset="100%" stop-color="#ffe94a"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a4250"/>
      <stop offset="100%" stop-color="#e8ecf2"/>
    </linearGradient>
  </defs>

  <ellipse cx="48" cy="84" rx="36" ry="6" fill="#000" opacity="0.4"/>

  <!-- oversized wheels -->
  <circle cx="24" cy="32" r="11" fill="#050508"/>
  <circle cx="24" cy="32" r="5" fill="#fff04a"/>
  <circle cx="26" cy="64" r="11" fill="#050508"/>
  <circle cx="26" cy="64" r="5" fill="#fff04a"/>
  <circle cx="48" cy="30" r="10" fill="#050508"/>
  <circle cx="48" cy="30" r="4.5" fill="#fff04a"/>
  <circle cx="50" cy="66" r="10" fill="#050508"/>
  <circle cx="50" cy="66" r="4.5" fill="#fff04a"/>

  <!-- compact yellow body -->
  <path d="M18 36 L50 28 L54 68 L22 64 Z" fill="url(#yel)" stroke="#6a5808"/>
  <path d="M28 40 L42 35 L46 48 L32 50 Z" fill="#ff2a9a"/>
  <path d="M34 52 L48 48 L50 60 L36 62 Z" fill="#ff4db8"/>

  <!-- rods -->
  <path d="M38 42 L34 18" stroke="#0a0a0e" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M44 40 L44 16" stroke="#0a0a0e" stroke-width="2.5" stroke-linecap="round"/>

  <!-- cradle + single-tooth disc -->
  <rect x="52" y="36" width="12" height="24" rx="1" fill="#0e1016"/>
  <ellipse cx="70" cy="48" rx="9" ry="24" fill="url(#blade)" stroke="#2a3038"/>
  <ellipse cx="70" cy="48" rx="3" ry="8" fill="#c8d0dc"/>
  <path d="M75 28 L88 22 L82 36 Z" fill="#d8dce4" stroke="#5a6270"/>

  <!-- forks -->
  <path d="M62 30 L94 22 L92 28 L64 34 Z" fill="#0a0a0e"/>
  <path d="M62 40 L92 36 L90 42 L64 44 Z" fill="#0a0a0e"/>
  <path d="M62 52 L92 58 L90 64 L62 58 Z" fill="#0a0a0e"/>
  <path d="M62 62 L94 74 L90 80 L60 68 Z" fill="#0a0a0e"/>
</svg>
