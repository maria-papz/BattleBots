<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Top-down Calypso (+X = forks / undercutter) -->
  <defs>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2898c8"/>
      <stop offset="100%" stop-color="#78e8f8"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c05810"/>
      <stop offset="100%" stop-color="#ff9830"/>
    </linearGradient>
  </defs>

  <ellipse cx="48" cy="86" rx="34" ry="5" fill="#000" opacity="0.38"/>

  <!-- wheels -->
  <circle cx="20" cy="34" r="8" fill="#121218" stroke="#0a0a0e"/>
  <circle cx="20" cy="34" r="3.5" fill="url(#orange)"/>
  <circle cx="20" cy="62" r="8" fill="#121218" stroke="#0a0a0e"/>
  <circle cx="20" cy="62" r="3.5" fill="url(#orange)"/>

  <!-- arch body -->
  <path d="M18 36 L48 26 L78 36 L72 68 L24 66 Z" fill="url(#cyan)" stroke="#0a0a0e" stroke-width="1.3"/>
  <path d="M30 38 L48 32 L66 38 L62 60 L34 58 Z" fill="url(#orange)" stroke="#0a0a0e" opacity="0.85"/>
  <!-- hex hint -->
  <polygon points="42,40 45,42 45,46 42,48 39,46 39,42" fill="#1a8098" stroke="#0a0a0e"/>
  <polygon points="50,40 53,42 53,46 50,48 47,46 47,42" fill="#1a8098" stroke="#0a0a0e"/>
  <!-- white guards -->
  <path d="M24 44 L28 38 L30 46 Z" fill="#ffffff" stroke="#0a0a0e"/>
  <path d="M66 44 L62 38 L60 46 Z" fill="#ffffff" stroke="#0a0a0e"/>

  <!-- lattice forks -->
  <path d="M58 30 L88 22 L86 28 L62 34 Z" fill="#121218" stroke="#0a0a0e"/>
  <path d="M62 34 L82 28" stroke="#2a2a30" stroke-width="1"/>
  <path d="M64 36 L80 32" stroke="#2a2a30" stroke-width="1"/>
  <path d="M58 50 L86 56 L84 62 L60 56 Z" fill="#121218" stroke="#0a0a0e"/>
  <path d="M84 56 L90 58 L86 62 Z" fill="url(#orange)"/>

  <!-- undercutter -->
  <ellipse cx="72" cy="48" rx="12" ry="6" fill="#0a0a0e" stroke="#121218" stroke-width="1.2"/>
  <ellipse cx="72" cy="48" rx="8" ry="3.5" fill="#121218"/>
  <path d="M66 48 L72 44 L78 48 L72 52 Z" fill="#2a2a30"/>
</svg>
