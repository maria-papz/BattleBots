<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Top-down Tombstone (+X = red bar) -->
  <defs>
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0a0e"/>
      <stop offset="100%" stop-color="#3a3a42"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#801018"/>
      <stop offset="50%" stop-color="#d02838"/>
      <stop offset="100%" stop-color="#801018"/>
    </linearGradient>
  </defs>

  <ellipse cx="48" cy="86" rx="34" ry="5" fill="#000" opacity="0.38"/>

  <!-- tubular frame -->
  <rect x="18" y="28" width="34" height="40" rx="2" fill="none" stroke="#2a2a30" stroke-width="3"/>
  <rect x="22" y="32" width="26" height="32" rx="1" fill="url(#black)" stroke="#0a0a0e"/>

  <!-- triangular plate -->
  <path d="M24 36 L50 30 L54 68 L28 66 Z" fill="#1a1a22" stroke="#0a0a0e" stroke-width="1.2"/>
  <path d="M30 42 L46 38 L48 58 L32 60 Z" fill="#0a0a0e"/>

  <!-- reaper hint -->
  <rect x="34" y="44" width="10" height="10" rx="1" fill="#0a0a0e" stroke="#2a2a30"/>
  <circle cx="39" cy="48" r="2.5" fill="#f0f0f4"/>

  <!-- wheels -->
  <circle cx="22" cy="38" r="7" fill="#121218" stroke="#0a0a0e"/>
  <circle cx="22" cy="38" r="2.5" fill="#8a93a5"/>
  <circle cx="22" cy="58" r="7" fill="#121218" stroke="#0a0a0e"/>
  <circle cx="22" cy="58" r="2.5" fill="#8a93a5"/>

  <!-- bar mount -->
  <rect x="50" y="42" width="6" height="12" rx="1" fill="#121218" stroke="#0a0a0e"/>

  <!-- red horizontal bar -->
  <rect x="56" y="44" width="34" height="8" rx="2" fill="url(#red)" stroke="#801018" stroke-width="1.2"/>
  <rect x="58" y="46" width="28" height="2" fill="#ff5060" opacity="0.35"/>
</svg>
