<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Top-down Terrortops (+X = rake / horns) -->
  <defs>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8a008"/>
      <stop offset="100%" stop-color="#ffe860"/>
    </linearGradient>
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0a0e"/>
      <stop offset="100%" stop-color="#2a2a30"/>
    </linearGradient>
    <pattern id="hazard" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#f0d020"/>
      <path d="M0 0 L6 6 M6 0 L0 6" stroke="#0a0a0e" stroke-width="2"/>
    </pattern>
  </defs>

  <ellipse cx="48" cy="86" rx="34" ry="5" fill="#000" opacity="0.38"/>

  <!-- body -->
  <path d="M16 30 L52 22 L58 74 L20 70 Z" fill="url(#black)" stroke="#0a0a0e" stroke-width="1.3"/>
  <path d="M24 34 L48 28 L50 66 L26 68 Z" fill="url(#yellow)" stroke="#0a0a0e"/>
  <path d="M38 36 L50 32 L52 58 L40 62 Z" fill="url(#hazard)"/>

  <!-- 1953 hint -->
  <rect x="30" y="42" width="12" height="5" rx="1" fill="#0a0a0e"/>
  <rect x="32" y="44" width="8" height="1.5" fill="#f0d020"/>

  <!-- rake tines (top side) -->
  <path d="M58 26 L88 18 L86 24 L60 30 Z" fill="url(#yellow)" stroke="#0a0a0e"/>
  <path d="M58 32 L84 28 L82 34 L60 36 Z" fill="url(#yellow)" stroke="#0a0a0e"/>
  <path d="M58 38 L82 36 L80 42 L60 42 Z" fill="url(#yellow)" stroke="#0a0a0e"/>
  <path d="M58 44 L80 44 L78 50 L60 48 Z" fill="url(#yellow)" stroke="#0a0a0e"/>
  <path d="M58 50 L78 52 L76 58 L60 54 Z" fill="url(#yellow)" stroke="#0a0a0e"/>
  <path d="M58 56 L76 60 L74 66 L60 60 Z" fill="url(#yellow)" stroke="#0a0a0e"/>
  <path d="M58 62 L74 68 L72 74 L60 66 Z" fill="url(#yellow)" stroke="#0a0a0e"/>

  <!-- lower wedge tines -->
  <path d="M58 48 L86 58 L84 66 L60 58 Z" fill="#121218" stroke="#0a0a0e"/>

  <!-- arm spine -->
  <rect x="34" y="44" width="22" height="5" rx="1" fill="#121218" stroke="#0a0a0e"/>

  <!-- triceratops horns (horizontal spinner) -->
  <ellipse cx="78" cy="48" rx="8" ry="18" fill="url(#yellow)" stroke="#0a0a0e" stroke-width="1.2"/>
  <path d="M72 32 L88 28 L84 36 L74 38 Z" fill="#ffe860" stroke="#0a0a0e"/>
  <path d="M72 64 L88 68 L84 60 L74 58 Z" fill="#ffe860" stroke="#0a0a0e"/>
  <circle cx="78" cy="48" r="3" fill="#0a0a0e"/>
</svg>
