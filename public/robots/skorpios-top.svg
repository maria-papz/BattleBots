<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Top-down Skorpios (+X = wedge / saw arm) -->
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1868a8"/>
      <stop offset="100%" stop-color="#58c8f8"/>
    </linearGradient>
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0a0e"/>
      <stop offset="100%" stop-color="#2a2a30"/>
    </linearGradient>
  </defs>

  <ellipse cx="48" cy="86" rx="34" ry="5" fill="#000" opacity="0.38"/>

  <!-- rear wheels -->
  <circle cx="24" cy="32" r="8" fill="#3a4050" stroke="#0a0a0e"/>
  <circle cx="24" cy="32" r="4" fill="#38a8e8"/>
  <circle cx="24" cy="64" r="8" fill="#3a4050" stroke="#0a0a0e"/>
  <circle cx="24" cy="64" r="4" fill="#38a8e8"/>

  <!-- chassis -->
  <path d="M16 30 L52 22 L58 74 L20 72 Z" fill="url(#black)" stroke="#0a0a0e" stroke-width="1.3"/>
  <path d="M24 36 L48 30 L50 66 L28 68 Z" fill="url(#blue)" stroke="#1868a8" stroke-width="1"/>

  <!-- name plate hint -->
  <rect x="30" y="38" width="14" height="5" rx="1" fill="#38a8e8"/>
  <rect x="32" y="40" width="10" height="1.5" fill="#0a0a0e" opacity="0.45"/>

  <!-- overhead arm spine -->
  <rect x="34" y="44" width="28" height="4" rx="1" fill="#121218" stroke="#0a0a0e"/>
  <rect x="58" y="42" width="6" height="8" rx="1" fill="#1a1a22"/>

  <!-- wedge plow -->
  <path d="M58 28 L92 18 L90 30 L62 38 Z" fill="#121218" stroke="#0a0a0e"/>
  <path d="M58 48 L88 58 L86 70 L60 60 Z" fill="#121218" stroke="#0a0a0e"/>
  <path d="M58 36 L82 32 L80 42 L60 44 Z" fill="#1a1a22" stroke="#0a0a0e"/>
  <path d="M58 54 L80 60 L78 66 L60 62 Z" fill="#1a1a22" stroke="#0a0a0e"/>
  <!-- center fork -->
  <path d="M58 40 L78 38 L76 50 L60 52 Z" fill="#0a0a0e" stroke="#121218"/>

  <!-- horns (narrow from top) -->
  <rect x="62" y="24" width="4" height="10" rx="1" fill="#0a0a0e"/>
  <rect x="62" y="62" width="4" height="10" rx="1" fill="#0a0a0e"/>

  <!-- blue spinning saw -->
  <circle cx="78" cy="48" r="14" fill="#38a8e8" stroke="#1868a8" stroke-width="1.3"/>
  <circle cx="78" cy="48" r="4" fill="#121218"/>
  <path d="M78 34 L82 40 L78 48 L86 50 L80 56 L78 48 L70 56 L64 50 L72 48 L68 40 Z"
        fill="#68d0f8" stroke="#1868a8" stroke-width="0.8"/>
</svg>
