<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 340" fill="none">
  <!--
    MadCatter - look-down 3/4 (like Magnitude/Malice layout):
      TOP visible grey bolted deck + LEDs + hub
      FRONT sloping GREY plow with cat eyes facing camera
      CENTER blue vertical disc rising from plow notch
      LEFT red/blue splat flank + large grey wheel
      RIGHT far grey wheel
  -->
  <defs>
    <linearGradient id="deck" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#e8ecf2"/>
      <stop offset="50%" stop-color="#a8b0bc"/>
      <stop offset="100%" stop-color="#6a7380"/>
    </linearGradient>
    <linearGradient id="plow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#d0d6e0"/>
      <stop offset="55%" stop-color="#9098a4"/>
      <stop offset="100%" stop-color="#4a5260"/>
    </linearGradient>
    <linearGradient id="disc" x1="0.15" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a8ae8"/>
      <stop offset="40%" stop-color="#1e73be"/>
      <stop offset="100%" stop-color="#0a2048"/>
    </linearGradient>
    <linearGradient id="iris" x1="0.35" y1="0" x2="0.65" y2="1">
      <stop offset="0%" stop-color="#b0d8ff"/>
      <stop offset="50%" stop-color="#3a88e8"/>
      <stop offset="100%" stop-color="#1850b0"/>
    </linearGradient>
    <linearGradient id="whl" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#6a7080"/>
      <stop offset="55%" stop-color="#3a4048"/>
      <stop offset="100%" stop-color="#12151a"/>
    </linearGradient>
  </defs>

  <ellipse cx="230" cy="318" rx="160" ry="13" fill="#000" opacity="0.3"/>

  <!-- FAR RIGHT WHEEL -->
  <ellipse cx="310" cy="235" rx="32" ry="32" fill="url(#whl)" stroke="#0a0a0e" stroke-width="2"/>
  <ellipse cx="310" cy="235" rx="18" ry="18" fill="#2a3038"/>
  <ellipse cx="310" cy="235" rx="7" ry="7" fill="#7a8088"/>

  <!-- NEAR LEFT WHEEL (large) -->
  <ellipse cx="80" cy="245" rx="46" ry="46" fill="url(#whl)" stroke="#0a0a0e" stroke-width="2.5"/>
  <ellipse cx="80" cy="245" rx="32" ry="32" fill="#2a3038"/>
  <ellipse cx="80" cy="245" rx="13" ry="13" fill="#7a8088"/>
  <ellipse cx="80" cy="245" rx="5" ry="5" fill="#12151a"/>

  <!-- LEFT SPLAT FLANK -->
  <path d="M55 190
           L100 130
           L160 120
           L180 170
           L165 220
           L70 230 Z"
        fill="#d0312d" stroke="#1a0808" stroke-width="1.8"/>
  <path d="M65 180 C95 150 130 148 150 175 C140 200 95 210 70 195 Z" fill="#1e73be"/>
  <path d="M110 135 C135 122 160 130 168 155 C155 175 125 170 110 155 Z" fill="#3a88d0"/>
  <path d="M85 195 C115 180 145 190 150 215 C130 230 95 230 85 210 Z" fill="#1560a8"/>
  <path d="M120 155 C138 148 152 158 148 172 C132 178 118 168 120 155 Z" fill="#e04038"/>

  <!-- TOP DECK (look-down) -->
  <path d="M105 175
           L165 125
           L280 130
           L310 175
           L270 205
           L145 210
           L110 190 Z"
        fill="url(#deck)" stroke="#3a4250" stroke-width="2"/>
  <path d="M160 155 L240 140 L260 170 L180 180 Z" fill="#7a8490" opacity="0.3"/>
  <g fill="#3a4250">
    <circle cx="130" cy="180" r="3"/>
    <circle cx="155" cy="145" r="3"/>
    <circle cx="205" cy="132" r="3"/>
    <circle cx="255" cy="138" r="3"/>
    <circle cx="290" cy="165" r="3"/>
    <circle cx="265" cy="190" r="3"/>
    <circle cx="200" cy="198" r="3"/>
    <circle cx="150" cy="195" r="3"/>
  </g>
  <circle cx="145" cy="165" r="4.5" fill="#3dff5a"/>
  <circle cx="143.8" cy="163.8" r="1.5" fill="#c0ffd0" opacity="0.7"/>
  <circle cx="255" cy="158" r="4.5" fill="#3dff5a"/>
  <circle cx="253.8" cy="156.8" r="1.5" fill="#c0ffd0" opacity="0.7"/>
  <!-- hub -->
  <ellipse cx="200" cy="165" rx="16" ry="12" fill="#5a6270" stroke="#2a323c"/>
  <path d="M192 160 C192 153 208 153 208 160 L208 170 L203 170 L203 162 C203 159 197 159 197 162 L197 170 L192 170 Z" fill="#0a0a0e"/>
  <!-- white holed plate -->
  <rect x="220" y="150" width="26" height="16" rx="2" fill="#e8ecf2" stroke="#8a9098"/>
  <circle cx="228" cy="158" r="2.8" fill="#4a5060"/>
  <circle cx="238" cy="158" r="2.8" fill="#4a5060"/>

  <!-- FRONT PLOW (sloping down toward bottom of frame = toward camera) -->
  <path d="M130 195
           L175 155
           L290 158
           L340 200
           L320 255
           L175 265
           L125 235 Z"
        fill="url(#plow)" stroke="#2a323c" stroke-width="2.4"/>
  <path d="M125 235 L175 265 L320 255 L305 235 L170 245 L140 225 Z"
        fill="#3a4250" opacity="0.4"/>

  <!-- red splat lower-left plow -->
  <path d="M140 230 C160 215 185 220 190 245 C175 265 150 265 140 250 Z" fill="#d0312d"/>
  <path d="M155 235 C170 228 182 238 178 250 C165 255 152 248 155 235 Z" fill="#1e73be"/>

  <!-- weapon notch in plow -->
  <path d="M220 165
           L265 162
           L275 230
           L230 235
           L215 190 Z"
        fill="#0a0a10" stroke="#050508"/>

  <!-- CAT EYES on plow face (looking at camera) -->
  <g transform="translate(175 210) rotate(-12)">
    <ellipse cx="0" cy="0" rx="32" ry="18" fill="#050508"/>
    <ellipse cx="0" cy="0" rx="26" ry="14" fill="url(#iris)"/>
    <rect x="-3.5" y="-11" width="7" height="22" rx="3" fill="#050508"/>
    <path d="M24 1 L44 -12" fill="none" stroke="#050508" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M22 7 L38 0" fill="none" stroke="#050508" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <g transform="translate(235 200) rotate(-2)">
    <ellipse cx="0" cy="0" rx="34" ry="19" fill="#050508"/>
    <ellipse cx="0" cy="0" rx="28" ry="15" fill="url(#iris)"/>
    <rect x="-4" y="-12" width="8" height="24" rx="3.5" fill="#050508"/>
    <path d="M26 0 L48 -14" fill="none" stroke="#050508" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M24 8 L42 0" fill="none" stroke="#050508" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- WHITE FIN -->
  <path d="M235 155
           L245 95
           L262 92
           L270 160
           L252 172 Z"
        fill="#f4f6fa" stroke="#8a9098" stroke-width="1.3"/>

  <!-- BLUE VERTICAL DISC (rises from center notch) -->
  <rect x="248" y="150" width="12" height="70" rx="2" fill="#1e73be" stroke="#0a2048"/>
  <g transform="translate(268 175)">
    <ellipse cx="8" cy="0" rx="8" ry="55" fill="#6a7380"/>
    <ellipse cx="0" cy="0" rx="14" ry="58" fill="url(#disc)" stroke="#0a2048" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="5" ry="12" fill="#c8d0dc" stroke="#3a4250"/>
    <ellipse cx="0" cy="0" rx="2" ry="5" fill="#2a323c"/>
    <ellipse cx="-4" cy="-20" rx="3" ry="14" fill="#9ab8ff" opacity="0.35"/>
  </g>

  <path d="M130 195 L175 155 L290 158 L340 200 L320 255 L175 265 L125 235 Z"
        fill="none" stroke="#2a323c" stroke-width="2"/>
</svg>
