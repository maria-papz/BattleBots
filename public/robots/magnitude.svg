<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" fill="none">
  <!--
    Magnitude from reference (3/4 front-left, looking down):
      blue top deck with yellow MAGNITUDE marks + spiral logo + red LED,
      grey side pods with yellow seismic bolt + ISM mark,
      grey HORIZONTAL DRUM with neon-yellow center band,
      four black wheels recessed in pods
  -->
  <defs>
    <linearGradient id="blu" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#6a9ac8"/>
      <stop offset="45%" stop-color="#4a74a5"/>
      <stop offset="100%" stop-color="#2a4870"/>
    </linearGradient>
    <linearGradient id="gry" x1="0.15" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#b8b8bc"/>
      <stop offset="45%" stop-color="#8a8a90"/>
      <stop offset="100%" stop-color="#585860"/>
    </linearGradient>
    <linearGradient id="gryDk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6a6a72"/>
      <stop offset="100%" stop-color="#3a3a42"/>
    </linearGradient>
    <linearGradient id="drum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8c8ce"/>
      <stop offset="40%" stop-color="#9898a0"/>
      <stop offset="100%" stop-color="#505058"/>
    </linearGradient>
    <linearGradient id="yel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0ff60"/>
      <stop offset="50%" stop-color="#dfff00"/>
      <stop offset="100%" stop-color="#a8c000"/>
    </linearGradient>
  </defs>

  <ellipse cx="240" cy="318" rx="170" ry="14" fill="#000" opacity="0.32"/>

  <!-- ===== REAR WHEELS (left pod) ===== -->
  <ellipse cx="95" cy="195" rx="28" ry="28" fill="#121218" stroke="#050508" stroke-width="2"/>
  <ellipse cx="95" cy="195" rx="16" ry="16" fill="#1a1a22"/>
  <ellipse cx="95" cy="195" rx="6" ry="6" fill="#3a4250"/>
  <ellipse cx="130" cy="230" rx="26" ry="26" fill="#121218" stroke="#050508" stroke-width="2"/>
  <ellipse cx="130" cy="230" rx="14" ry="14" fill="#1a1a22"/>
  <ellipse cx="130" cy="230" rx="5.5" ry="5.5" fill="#3a4250"/>

  <!-- ===== LEFT SIDE POD (near) ===== -->
  <path d="M55 175
           L120 110
           L195 120
           L210 185
           L175 245
           L70 240 Z"
        fill="url(#gry)" stroke="#2a2a32" stroke-width="2"/>
  <!-- pod facets -->
  <path d="M55 175 L70 240 L120 210 L110 155 Z" fill="url(#gryDk)" opacity="0.7"/>
  <path d="M120 110 L195 120 L185 155 L115 145 Z" fill="#a8a8b0" opacity="0.45"/>
  <!-- front face of left pod (hex-ish) -->
  <path d="M175 155
           L210 145
           L230 175
           L215 215
           L180 220
           L165 185 Z"
        fill="url(#gryDk)" stroke="#2a2a32" stroke-width="1.5"/>
  <!-- three bolt recesses -->
  <circle cx="190" cy="175" r="5" fill="#1a1a22"/>
  <circle cx="205" cy="185" r="5" fill="#1a1a22"/>
  <circle cx="192" cy="200" r="5" fill="#1a1a22"/>
  <!-- yellow seismic / heartbeat bolt -->
  <path d="M172 168
           L188 168
           L195 155
           L208 188
           L218 172
           L228 172"
        fill="none" stroke="#dfff00" stroke-width="4" stroke-linejoin="miter" stroke-linecap="square"/>
  <!-- ISM / crown mark on top of pod -->
  <g fill="#dfff00" transform="translate(130 128) scale(0.55)">
    <path d="M0 18 L8 0 L12 10 L16 0 L24 18 L20 18 L16 8 L12 16 L8 8 L4 18 Z"/>
    <rect x="2" y="18" width="4" height="10"/>
    <rect x="10" y="14" width="4" height="14"/>
    <rect x="18" y="18" width="4" height="10"/>
  </g>

  <!-- ===== RIGHT/FAR SIDE POD (behind drum) ===== -->
  <path d="M280 95
           L350 85
           L400 120
           L390 175
           L320 190
           L270 150 Z"
        fill="url(#gry)" stroke="#2a2a32" stroke-width="2"/>
  <path d="M350 85 L400 120 L385 140 L340 110 Z" fill="#a8a8b0" opacity="0.4"/>
  <!-- far front face -->
  <path d="M320 140
           L360 130
           L380 155
           L365 185
           L325 190
           L310 160 Z"
        fill="url(#gryDk)" stroke="#2a2a32"/>
  <circle cx="340" cy="155" r="4.5" fill="#1a1a22"/>
  <circle cx="355" cy="162" r="4.5" fill="#1a1a22"/>
  <circle cx="342" cy="172" r="4.5" fill="#1a1a22"/>
  <path d="M318 150 L335 150 L342 138 L352 168 L362 152 L378 152"
        fill="none" stroke="#dfff00" stroke-width="3.5" stroke-linejoin="miter"/>
  <!-- far wheels peek -->
  <ellipse cx="355" cy="175" rx="20" ry="20" fill="#121218" stroke="#050508"/>
  <ellipse cx="355" cy="175" rx="8" ry="8" fill="#2a2a34"/>

  <!-- ===== BLUE TOP DECK ===== -->
  <path d="M115 145
           L200 95
           L320 100
           L355 145
           L310 185
           L160 190
           L120 165 Z"
        fill="url(#blu)" stroke="#1a3048" stroke-width="2.2"/>
  <!-- chamfer hint -->
  <path d="M125 150 L205 105 L310 110 L340 145" fill="none" stroke="#8ab4d8" stroke-width="1.5" opacity="0.3"/>
  <!-- bolts around perimeter -->
  <g fill="#2a2a34">
    <circle cx="140" cy="155" r="3.5"/>
    <circle cx="175" cy="125" r="3.5"/>
    <circle cx="230" cy="108" r="3.5"/>
    <circle cx="285" cy="112" r="3.5"/>
    <circle cx="330" cy="140" r="3.5"/>
    <circle cx="315" cy="170" r="3.5"/>
    <circle cx="250" cy="180" r="3.5"/>
    <circle cx="175" cy="175" r="3.5"/>
  </g>
  <!-- red LED -->
  <circle cx="155" cy="145" r="5" fill="#ff1010"/>
  <circle cx="153.5" cy="143.5" r="1.8" fill="#ff9090" opacity="0.7"/>
  <!-- yellow ring switch (aft) -->
  <circle cx="300" cy="165" r="6" fill="none" stroke="#dfff00" stroke-width="2.5"/>
  <circle cx="300" cy="165" r="2.5" fill="#2a2a34"/>

  <!-- MAGNITUDE path lettering (no text nodes) -->
  <g fill="#dfff00" transform="translate(145 152) rotate(-12) scale(0.42)">
    <!-- M -->
    <path d="M0 0 L0 28 L6 28 L6 12 L12 22 L18 12 L18 28 L24 28 L24 0 L16 0 L12 10 L8 0 Z"/>
    <!-- A -->
    <path d="M28 28 L36 0 L44 0 L52 28 L45 28 L43 20 L37 20 L35 28 Z M38 15 L42 15 L40 8 Z"/>
    <!-- G -->
    <path d="M56 4 C56 0 62 0 68 0 C74 0 80 4 80 14 C80 24 74 28 66 28 C58 28 54 22 54 14 L60 14 C60 20 62 22 66 22 C70 22 74 20 74 14 C74 8 70 6 66 6 C62 6 60 8 60 10 L68 10 L68 16 L56 16 Z"/>
    <!-- N -->
    <path d="M86 0 L86 28 L92 28 L92 12 L104 28 L110 28 L110 0 L104 0 L104 16 L92 0 Z"/>
    <!-- I -->
    <rect x="116" y="0" width="6" height="28"/>
    <!-- T -->
    <path d="M126 0 L150 0 L150 6 L141 6 L141 28 L135 28 L135 6 L126 6 Z"/>
    <!-- U -->
    <path d="M154 0 L154 18 C154 26 160 28 166 28 C172 28 178 26 178 18 L178 0 L172 0 L172 18 C172 22 170 22 166 22 C162 22 160 22 160 18 L160 0 Z"/>
    <!-- D -->
    <path d="M184 0 L184 28 L198 28 C208 28 212 20 212 14 C212 8 208 0 198 0 Z M190 6 L196 6 C200 6 206 8 206 14 C206 20 200 22 196 22 L190 22 Z"/>
    <!-- E -->
    <path d="M218 0 L218 28 L240 28 L240 22 L224 22 L224 17 L236 17 L236 11 L224 11 L224 6 L240 6 L240 0 Z"/>
  </g>

  <!-- yellow spiral / concentric logo -->
  <g transform="translate(280 140)" fill="none" stroke="#dfff00" stroke-width="2.8" stroke-linecap="square">
    <circle r="28" stroke-dasharray="40 18"/>
    <circle r="18" stroke-dasharray="28 12"/>
    <circle r="9" stroke-dasharray="16 8"/>
    <rect x="-4" y="-4" width="8" height="8" fill="#dfff00" stroke="none"/>
  </g>

  <!-- ===== GREY DRUM WITH YELLOW BAND ===== -->
  <!-- drum body (horizontal cylinder) -->
  <ellipse cx="245" cy="210" rx="95" ry="38" fill="url(#drum)" stroke="#2a2a32" stroke-width="2"/>
  <!-- cylinder middle fill -->
  <path d="M155 195
           L335 175
           L340 225
           L160 245 Z"
        fill="url(#drum)"/>
  <!-- end caps -->
  <ellipse cx="158" cy="220" rx="18" ry="28" fill="#6a6a72" stroke="#2a2a32" stroke-width="1.5"/>
  <ellipse cx="338" cy="200" rx="16" ry="26" fill="#a8a8b0" stroke="#2a2a32" stroke-width="1.5"/>
  <!-- NEON YELLOW center band -->
  <path d="M210 185
           L270 175
           L278 235
           L218 245 Z"
        fill="url(#yel)" stroke="#8a9800" stroke-width="1.2"/>
  <path d="M215 192 L265 184 L268 200 L218 208 Z" fill="#f8ff90" opacity="0.45"/>
  <!-- axle -->
  <ellipse cx="248" cy="210" rx="8" ry="12" fill="#3a3a42" stroke="#1a1a22"/>
  <ellipse cx="248" cy="210" rx="3.5" ry="5" fill="#c8c8d0"/>
  <!-- drum highlight -->
  <path d="M170 200 L320 182" stroke="#fff" stroke-width="3" opacity="0.12"/>
</svg>
