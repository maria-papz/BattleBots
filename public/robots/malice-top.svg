<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!--
    Top-down Malice (+X = front ring):
      grey body + Y brace, red ring with teeth, red forks, grey wheels aft
  -->
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a5060"/>
      <stop offset="100%" stop-color="#d0d4dc"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a0810"/>
      <stop offset="100%" stop-color="#ff4040"/>
    </linearGradient>
  </defs>

  <ellipse cx="48" cy="86" rx="34" ry="5" fill="#000" opacity="0.38"/>

  <!-- rear wheels -->
  <circle cx="22" cy="30" r="10" fill="#3a4050" stroke="#0a0a0e"/>
  <circle cx="22" cy="30" r="4" fill="#8a909a"/>
  <circle cx="22" cy="66" r="10" fill="#3a4050" stroke="#0a0a0e"/>
  <circle cx="22" cy="66" r="4" fill="#8a909a"/>

  <!-- grey chassis -->
  <path d="M16 34 L48 26 L52 70 L20 68 Z" fill="url(#steel)" stroke="#2a3038" stroke-width="1.3"/>
  <circle cx="30" cy="42" r="2.2" fill="#3dff5a"/>
  <circle cx="30" cy="58" r="2.2" fill="#3dff5a"/>

  <!-- Y brace -->
  <path d="M36 40 L62 44 L62 52 L36 56 Z" fill="#8a909a" stroke="#2a3038"/>
  <circle cx="40" cy="48" r="5" fill="#4a5060" stroke="#1a1e28"/>

  <!-- red forks -->
  <path d="M50 28 L88 22 L86 34 L52 38 Z" fill="url(#red)" stroke="#4a0810"/>
  <path d="M50 62 L88 66 L86 78 L52 72 Z" fill="url(#red)" stroke="#4a0810"/>
  <path d="M84 20 L94 26 L84 32 Z" fill="#9aa0aa"/>
  <path d="M84 68 L94 72 L84 78 Z" fill="#9aa0aa"/>

  <!-- red ring -->
  <circle cx="68" cy="48" r="18" fill="url(#red)" stroke="#4a0810" stroke-width="1.4"/>
  <circle cx="68" cy="48" r="11" fill="#0e1016"/>
  <circle cx="68" cy="48" r="11" fill="none" stroke="#7a0810" stroke-width="3"/>
  <!-- spokes -->
  <path d="M68 48 L58 40" stroke="#d01818" stroke-width="3"/>
  <path d="M68 48 L78 56" stroke="#d01818" stroke-width="3"/>
  <!-- teeth -->
  <rect x="52" y="30" width="8" height="6" rx="1" fill="#9aa0aa" transform="rotate(-20 56 33)"/>
  <rect x="76" y="60" width="8" height="6" rx="1" fill="#6a7080" transform="rotate(-20 80 63)"/>
  <!-- hub -->
  <circle cx="68" cy="48" r="4" fill="#d01818"/>
  <circle cx="68" cy="48" r="1.8" fill="#2a3038"/>
</svg>
