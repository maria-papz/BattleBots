<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!--
    Top-down Orbitron (+X = twin flared teeth):
      white wedge aft, black wheels, blue+gold flared teeth at +X on arms
  -->
  <defs>
    <linearGradient id="wht" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9aa2ae"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="blu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a2868"/>
      <stop offset="100%" stop-color="#4a90f0"/>
    </linearGradient>
    <linearGradient id="gld" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6a4808"/>
      <stop offset="100%" stop-color="#f4d050"/>
    </linearGradient>
  </defs>

  <ellipse cx="48" cy="86" rx="34" ry="5" fill="#000" opacity="0.38"/>

  <!-- white wedge -->
  <path d="M10 28 L50 18 L54 78 L14 72 Z" fill="url(#wht)" stroke="#5a6270" stroke-width="1.4"/>

  <!-- grey deck -->
  <path d="M28 36 L52 30 L54 66 L30 70 Z" fill="#7a8490" opacity="0.5"/>
  <rect x="32" y="42" width="12" height="8" rx="1" fill="#0e0e14"/>
  <circle cx="36" cy="46" r="1.8" fill="#e01828"/>
  <circle cx="41" cy="46" r="1.8" fill="#3dff5a"/>
  <rect x="42" y="52" width="8" height="8" fill="#0e0e14"/>
  <rect x="43.5" y="53.5" width="2.2" height="2.2" fill="#3a90e0"/>
  <rect x="46.5" y="53.5" width="2.2" height="2.2" fill="#3a90e0"/>
  <rect x="43.5" y="56.5" width="2.2" height="2.2" fill="#3a90e0"/>
  <rect x="46.5" y="56.5" width="2.2" height="2.2" fill="#3a90e0"/>

  <!-- wheels -->
  <circle cx="32" cy="30" r="9" fill="#121218"/>
  <circle cx="32" cy="30" r="3.5" fill="#3a4250"/>
  <circle cx="32" cy="66" r="9" fill="#121218"/>
  <circle cx="32" cy="66" r="3.5" fill="#3a4250"/>

  <!-- hub + arms -->
  <circle cx="62" cy="48" r="7" fill="#4a5260"/>
  <path d="M62 42 L78 28" stroke="#c8d0dc" stroke-width="3" stroke-linecap="round"/>
  <path d="M62 54 L78 68" stroke="#a8b0bc" stroke-width="3" stroke-linecap="round"/>
  <circle cx="78" cy="28" r="4" fill="#1e5ab8"/>
  <circle cx="78" cy="68" r="4" fill="#d0a020"/>

  <!-- blue flared tooth (top) -->
  <ellipse cx="88" cy="22" rx="7" ry="12" fill="url(#blu)" stroke="#0a2868"/>
  <ellipse cx="92" cy="14" rx="8" ry="4" fill="#1e5ab8"/>
  <!-- gold flared tooth (bottom) -->
  <ellipse cx="88" cy="74" rx="7" ry="12" fill="url(#gld)" stroke="#6a4808"/>
  <ellipse cx="92" cy="82" rx="8" ry="4" fill="#d0a020"/>
</svg>
