<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Top-down Banshee (+X = flipper / forks) -->
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#68a818"/>
      <stop offset="100%" stop-color="#d8ff60"/>
    </linearGradient>
    <linearGradient id="camo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#286010"/>
      <stop offset="100%" stop-color="#88d028"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2080d8"/>
      <stop offset="100%" stop-color="#58b8ff"/>
    </linearGradient>
  </defs>

  <ellipse cx="48" cy="86" rx="34" ry="5" fill="#000" opacity="0.38"/>

  <!-- body -->
  <path d="M18 32 L52 24 L58 70 L22 68 Z" fill="#121218" stroke="#0a0a0e" stroke-width="1.3"/>
  <path d="M24 36 L48 30 L52 64 L28 66 Z" fill="url(#camo)" stroke="#0a0a0e"/>
  <path d="M30 40 L42 36 L44 52 L32 54 Z" fill="#488818" opacity="0.55"/>

  <!-- linkage hint -->
  <path d="M34 46 L48 42 L52 52 L38 56 Z" fill="url(#blue)" stroke="#0a0a0e" opacity="0.85"/>

  <!-- flipper arm -->
  <path d="M52 34 L78 28 L82 48 L58 52 Z" fill="#121218" stroke="#0a0a0e" stroke-width="1.2"/>
  <path d="M60 36 L74 32 L76 44 L62 46 Z" fill="url(#green)" stroke="#0a0a0e"/>
  <circle cx="72" cy="38" r="3" fill="url(#green)" stroke="#0a0a0e"/>
  <ellipse cx="76" cy="40" rx="2" ry="3" fill="#0a0a0e"/>

  <!-- front forks -->
  <path d="M58 28 L88 22 L86 30 L60 34 Z" fill="url(#green)" stroke="#0a0a0e"/>
  <path d="M58 48 L86 54 L84 62 L60 56 Z" fill="url(#green)" stroke="#0a0a0e"/>
  <path d="M86 22 L92 20 L90 28 Z" fill="#68a818"/>
  <path d="M84 54 L90 58 L86 62 Z" fill="#68a818"/>
</svg>
