  -->
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#9ad4e8"/>
      <stop offset="45%" stop-color="#6eb8d4"/>
      <stop offset="100%" stop-color="#4a98b8"/>
