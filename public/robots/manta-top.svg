<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!--
    Top-down Manta (+X = front gold drum), no lettering:
      blue body, grey center, gold disc, blue forks
  -->
  <defs>
    <linearGradient id="blu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e2858"/>
      <stop offset="100%" stop-color="#3a6ab0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6a4808"/>
      <stop offset="100%" stop-color="#ffe060"/>
    </linearGradient>
  </defs>

  <ellipse cx="48" cy="86" rx="34" ry="5" fill="#000" opacity="0.38"/>

  <!-- wheels -->
  <circle cx="22" cy="28" r="7" fill="#3a4050"/>
  <circle cx="22" cy="68" r="7" fill="#3a4050"/>
  <circle cx="48" cy="26" r="6" fill="#3a4050"/>
  <circle cx="48" cy="70" r="6" fill="#3a4050"/>

  <!-- blue body -->
  <path d="M14 30 L52 22 L56 74 L18 70 Z" fill="url(#blu)" stroke="#0a1838" stroke-width="1.3"/>
  <!-- grey center -->
  <path d="M30 36 L50 32 L52 64 L32 66 Z" fill="#8a909a" stroke="#2a3038"/>
  <path d="M34 42 L38 40 L37 50 Z" fill="#2a3038"/>
  <path d="M40 41 L44 39 L43 50 Z" fill="#2a3038"/>
  <path d="M36 52 L40 50 L39 60 Z" fill="#2a3038"/>

  <!-- blue mounts -->
  <circle cx="62" cy="38" r="8" fill="#1e4a88"/>
  <circle cx="62" cy="58" r="8" fill="#1e4a88"/>

  <!-- gold drum -->
  <ellipse cx="76" cy="48" rx="10" ry="22" fill="url(#gold)" stroke="#5a4008" stroke-width="1.3"/>
  <ellipse cx="76" cy="40" rx="5" ry="2.5" fill="#3a2808"/>
  <ellipse cx="76" cy="48" rx="5" ry="2.5" fill="#3a2808"/>
  <ellipse cx="76" cy="56" rx="5" ry="2.5" fill="#3a2808"/>
  <rect x="70" y="24" width="12" height="5" rx="1" fill="#e0b020"/>
  <rect x="72" y="68" width="8" height="4" rx="1" fill="#b08010"/>

  <!-- forks -->
  <path d="M64 30 L92 20 L90 28 L66 36 Z" fill="#1e4a88" stroke="#0a1838"/>
  <path d="M64 62 L88 70 L86 80 L62 70 Z" fill="#1e4a88" stroke="#0a1838"/>
  <path d="M86 72 L94 74 L92 84 L84 80 Z" fill="#3a6ab0"/>
</svg>
