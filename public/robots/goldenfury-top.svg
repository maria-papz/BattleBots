<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Top-down Golden Fury: red scoop + dual discs at +X -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a6a18"/>
      <stop offset="100%" stop-color="#e8c86a"/>
    </linearGradient>
    <linearGradient id="redW" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a0808"/>
      <stop offset="100%" stop-color="#ff4a4a"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a0808"/>
      <stop offset="100%" stop-color="#ff6060"/>
    </linearGradient>
  </defs>

  <ellipse cx="48" cy="82" rx="34" ry="7" fill="#000" opacity="0.4"/>

  <!-- gold side body -->
  <path d="M12 30 L40 22 L44 74 L16 70 Z" fill="url(#gold)" stroke="#4a3808"/>
  <!-- black top -->
  <path d="M28 34 L52 28 L54 68 L30 72 Z" fill="#14161c" stroke="#050508"/>
  <!-- red vents -->
  <path d="M34 40 L40 36 L46 40 L40 44 Z" fill="#c81820"/>
  <path d="M36 52 L42 48 L48 52 L42 56 Z" fill="#c81820"/>
  <path d="M34 62 L40 58 L46 62 L40 66 Z" fill="#c81820"/>

  <!-- wheels -->
  <circle cx="22" cy="38" r="7" fill="#0a0a0e"/>
  <circle cx="22" cy="38" r="3" fill="#a8b0bc"/>
  <circle cx="24" cy="58" r="7" fill="#0a0a0e"/>
  <circle cx="24" cy="58" r="3" fill="#a8b0bc"/>

  <!-- red fins -->
  <path d="M38 32 L42 22 L46 34 Z" fill="#d01818"/>
  <path d="M46 30 L52 18 L54 32 Z" fill="#d01818"/>

  <!-- red scoop -->
  <path d="M52 28 L90 22 L88 74 L54 70 Z" fill="url(#redW)" stroke="#4a0808"/>

  <!-- black frame + dual discs -->
  <rect x="58" y="34" width="16" height="28" rx="1" fill="#0e1014" stroke="#050508"/>
  <ellipse cx="64" cy="48" rx="5" ry="16" fill="url(#disc)" stroke="#4a0808"/>
  <ellipse cx="72" cy="48" rx="5" ry="18" fill="url(#disc)" stroke="#4a0808"/>
  <ellipse cx="68" cy="48" rx="2.5" ry="8" fill="#c8d0dc"/>
  <circle cx="68" cy="30" r="2.5" fill="#ff4050"/>
  <circle cx="68" cy="66" r="2.5" fill="#ff4050"/>
</svg>
