<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Top-down HUGE: giant wheels + bar spinner at center, facing +X -->
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0c020"/>
      <stop offset="40%" stop-color="#2a58b0"/>
      <stop offset="100%" stop-color="#f0c020"/>
    </linearGradient>
  </defs>

  <ellipse cx="48" cy="84" rx="36" ry="6" fill="#000" opacity="0.35"/>

  <!-- wheels as ellipses from top -->
  <ellipse cx="48" cy="22" rx="28" ry="10" fill="#0a0a0e"/>
  <ellipse cx="48" cy="22" rx="22" ry="7" fill="#f2f4f8" stroke="#8a93a0"/>
  <ellipse cx="48" cy="74" rx="28" ry="10" fill="#0a0a0e"/>
  <ellipse cx="48" cy="74" rx="22" ry="7" fill="#f2f4f8" stroke="#8a93a0"/>

  <!-- axle -->
  <rect x="20" y="44" width="56" height="8" rx="2" fill="#a8b0bc" stroke="#5a6270"/>

  <!-- pods -->
  <rect x="28" y="36" width="16" height="24" rx="2" fill="#e8ecf2" stroke="#5a6270"/>
  <rect x="52" y="36" width="16" height="24" rx="2" fill="#e8ecf2" stroke="#5a6270"/>
  <!-- angry eyes on pods -->
  <ellipse cx="36" cy="46" rx="5" ry="4" fill="#2a58b0"/>
  <ellipse cx="37" cy="46" rx="2" ry="2" fill="#0a1020"/>
  <path d="M30 41 L42 39 L41 43 L31 44 Z" fill="#1a3050"/>
  <ellipse cx="60" cy="46" rx="5" ry="4" fill="#2a58b0"/>
  <ellipse cx="61" cy="46" rx="2" ry="2" fill="#0a1020"/>
  <path d="M54 41 L66 39 L65 43 L55 44 Z" fill="#1a3050"/>

  <!-- vertical bar (line from top) -->
  <rect x="44" y="30" width="8" height="36" rx="2" fill="url(#bar)" stroke="#1a3050"/>
  <circle cx="48" cy="48" r="4" fill="#1a3050"/>
  <circle cx="48" cy="48" r="2" fill="#c8d0dc"/>
</svg>
