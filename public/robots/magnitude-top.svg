<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!--
    Top-down Magnitude (+X = front drum):
      blue deck, grey side pods, grey drum with yellow band at +X
  -->
  <defs>
    <linearGradient id="blu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a4870"/>
      <stop offset="100%" stop-color="#6a9ac8"/>
    </linearGradient>
    <linearGradient id="drum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#505058"/>
      <stop offset="100%" stop-color="#c8c8ce"/>
    </linearGradient>
  </defs>

  <ellipse cx="48" cy="86" rx="34" ry="5" fill="#000" opacity="0.38"/>

  <!-- black wheels -->
  <circle cx="28" cy="28" r="8" fill="#121218"/>
  <circle cx="28" cy="28" r="3" fill="#3a4250"/>
  <circle cx="28" cy="68" r="8" fill="#121218"/>
  <circle cx="28" cy="68" r="3" fill="#3a4250"/>
  <circle cx="55" cy="26" r="7" fill="#121218"/>
  <circle cx="55" cy="70" r="7" fill="#121218"/>

  <!-- grey side pods -->
  <path d="M18 24 L52 18 L54 40 L20 44 Z" fill="#8a8a90" stroke="#2a2a32"/>
  <path d="M18 56 L54 52 L52 78 L20 76 Z" fill="#8a8a90" stroke="#2a2a32"/>
  <!-- yellow bolts on pods -->
  <path d="M30 28 L38 28 L42 24 L46 34 L50 28" fill="none" stroke="#dfff00" stroke-width="1.8"/>
  <path d="M30 62 L38 62 L42 58 L46 68 L50 62" fill="none" stroke="#dfff00" stroke-width="1.8"/>

  <!-- blue top deck -->
  <path d="M22 36 L58 30 L60 66 L24 70 Z" fill="url(#blu)" stroke="#1a3048" stroke-width="1.3"/>
  <circle cx="30" cy="42" r="1.5" fill="#2a2a34"/>
  <circle cx="40" cy="38" r="1.5" fill="#2a2a34"/>
  <circle cx="50" cy="40" r="1.5" fill="#2a2a34"/>
  <circle cx="48" cy="58" r="1.5" fill="#2a2a34"/>
  <circle cx="32" cy="60" r="1.5" fill="#2a2a34"/>
  <!-- red LED -->
  <circle cx="34" cy="48" r="2.2" fill="#ff1010"/>
  <!-- yellow spiral -->
  <circle cx="48" cy="50" r="7" fill="none" stroke="#dfff00" stroke-width="1.4"/>
  <circle cx="48" cy="50" r="4" fill="none" stroke="#dfff00" stroke-width="1.2"/>
  <rect x="46.5" y="48.5" width="3" height="3" fill="#dfff00"/>

  <!-- grey drum at +X -->
  <ellipse cx="78" cy="48" rx="12" ry="26" fill="url(#drum)" stroke="#2a2a32" stroke-width="1.3"/>
  <!-- yellow band -->
  <rect x="72" y="38" width="12" height="20" fill="#dfff00"/>
  <ellipse cx="78" cy="48" rx="3" ry="6" fill="#3a3a42"/>
</svg>
