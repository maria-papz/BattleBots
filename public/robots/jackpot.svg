<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" fill="none">
  <!--
    Jackpot — traced from reference photo (3/4 front-left):
      FRONT = red/black vertical-stripe wedges + skull badge
      MID   = lime-green chassis deck + red rear wheel (left)
      RIGHT = twin glitter HEART discs on silver axle in green uprights + belt
      UP    = two tall black lift/srimech arms, gold joints, red two-tine forks
  -->
  <defs>
    <linearGradient id="g" x1="0.1" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#58d048"/>
      <stop offset="45%" stop-color="#2eb82e"/>
      <stop offset="100%" stop-color="#127018"/>
    </linearGradient>
    <linearGradient id="gb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#127018"/>
      <stop offset="45%" stop-color="#48c840"/>
      <stop offset="100%" stop-color="#127018"/>
    </linearGradient>
    <radialGradient id="hf" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff6a78"/>
      <stop offset="35%" stop-color="#e01828"/>
      <stop offset="70%" stop-color="#a00818"/>
      <stop offset="100%" stop-color="#480810"/>
    </radialGradient>
    <linearGradient id="he" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#280408"/>
      <stop offset="50%" stop-color="#901018"/>
      <stop offset="100%" stop-color="#280408"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef0f4"/>
      <stop offset="50%" stop-color="#98a0ac"/>
      <stop offset="100%" stop-color="#303840"/>
    </linearGradient>
    <linearGradient id="au" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c868"/>
      <stop offset="55%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#6a4810"/>
    </linearGradient>
    <linearGradient id="w" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ff3848"/>
      <stop offset="55%" stop-color="#c01020"/>
      <stop offset="100%" stop-color="#500810"/>
    </linearGradient>
    <pattern id="vs" width="12" height="90" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <rect width="6" height="90" fill="#e01828"/>
      <rect x="6" width="6" height="90" fill="#1a1a1a"/>
    </pattern>
    <!-- classic heart face (point down), unit-ish -->
  </defs>

  <ellipse cx="260" cy="382" rx="195" ry="14" fill="#000" opacity="0.3"/>

  <!-- RED WHEEL (rear left) -->
  <ellipse cx="72" cy="262" rx="36" ry="36" fill="url(#w)" stroke="#400810" stroke-width="2.5"/>
  <ellipse cx="72" cy="262" rx="24" ry="24" fill="#801018"/>
  <ellipse cx="72" cy="262" rx="12" ry="12" fill="#280810"/>
  <ellipse cx="72" cy="262" rx="4.5" ry="4.5" fill="#c8d0dc"/>

  <!-- GREEN DECK -->
  <path d="M55 230 L165 175 L320 170 L385 210 L360 268 L175 285 L60 260 Z"
        fill="url(#g)" stroke="#0c3814" stroke-width="2"/>
  <path d="M55 230 L72 262 L185 278 L168 220 Z" fill="#127018" opacity="0.5"/>
  <g fill="#c8d0dc">
    <circle cx="140" cy="210" r="3.2"/><circle cx="190" cy="192" r="3.2"/>
    <circle cx="245" cy="188" r="3.2"/><circle cx="295" cy="195" r="3.2"/>
    <circle cx="335" cy="215" r="3.2"/><circle cx="175" cy="248" r="2.8"/>
    <circle cx="240" cy="252" r="2.8"/><circle cx="300" cy="248" r="2.8"/>
  </g>

  <!-- STRIPED WEDGES -->
  <path d="M45 215 L175 158 L210 230 L95 270 Z" fill="url(#vs)" stroke="#0a0a0e" stroke-width="2.5"/>
  <path d="M160 162 L275 152 L295 235 L185 250 Z" fill="url(#vs)" stroke="#0a0a0e" stroke-width="2.5"/>
  <path d="M262 158 L360 170 L365 240 L280 252 Z" fill="url(#vs)" stroke="#0a0a0e" stroke-width="2.5"/>

  <!-- skull badge -->
  <g transform="translate(118 220)">
    <circle r="15" fill="#d40000" stroke="#fff" stroke-width="1.4"/>
    <ellipse cy="-2" rx="8.5" ry="7.5" fill="#f4f4f8"/>
    <circle cx="-3.5" cy="-3" r="2.1" fill="#1a1a1a"/>
    <circle cx="3.5" cy="-3" r="2.1" fill="#1a1a1a"/>
    <path d="M-4 3 L0 6 L4 3" fill="none" stroke="#1a1a1a" stroke-width="1.3"/>
    <path d="M-10 10 L-4.5 6 M10 10 L4.5 6" stroke="#f4f4f8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ===== WEAPON ASSEMBLY (right) ===== -->
  <!-- green uprights -->
  <rect x="305" y="100" width="20" height="140" rx="2.5" fill="url(#gb)" stroke="#0c3814" stroke-width="1.6"/>
  <rect x="385" y="108" width="18" height="132" rx="2.5" fill="url(#gb)" stroke="#0c3814" stroke-width="1.6"/>
  <rect x="298" y="228" width="36" height="14" rx="2" fill="#127018" stroke="#0c3814"/>
  <rect x="378" y="228" width="34" height="14" rx="2" fill="#127018" stroke="#0c3814"/>
  <rect x="320" y="165" width="70" height="9" rx="1" fill="#2eb82e" stroke="#0c3814"/>
  <!-- SCS -->
  <g fill="none" stroke="#f4f6fa" stroke-width="2" opacity="0.8" transform="translate(308 145) scale(0.36)">
    <path d="M0 8 C0 0 14 -2 14 8 C14 18 0 16 0 24 C0 34 16 32 16 32"/>
    <path d="M22 0 L22 32 M22 0 L34 0 M22 14 L32 14 M22 32 L34 32"/>
    <path d="M40 8 C40 0 54 -2 54 8 C54 18 40 16 40 24 C40 34 56 32 56 32"/>
  </g>
  <!-- heart plate on outer upright -->
  <path d="M398 128 C398 118 410 116 415 126 C420 116 432 118 432 128 C432 146 415 162 415 162 C415 162 398 146 398 128 Z"
        fill="#d40000" stroke="#480810" stroke-width="1.3"/>
  <circle cx="406" cy="130" r="1.5" fill="#c8d0dc"/><circle cx="424" cy="130" r="1.5" fill="#c8d0dc"/>

  <!-- belt -->
  <ellipse cx="355" cy="138" rx="46" ry="17" fill="none" stroke="#1a1a1a" stroke-width="8"/>
  <ellipse cx="355" cy="138" rx="46" ry="17" fill="none" stroke="#333" stroke-width="2"/>

  <!-- REAR heart disc (axle-mounted, thick) -->
  <g transform="translate(330 142) rotate(-8) scale(1.05,1.25)">
    <ellipse cx="8" cy="0" rx="10" ry="52" fill="url(#he)"/>
    <path d="M0 46 C0 46 -40 10 -40 -14 C-40 -34 -26 -44 -12 -44 C-3 -44 0 -34 0 -26 C0 -34 3 -44 12 -44 C26 -44 40 -34 40 -14 C40 10 0 46 0 46 Z"
          fill="url(#hf)" stroke="#380810" stroke-width="1.8"/>
    <circle cx="-10" cy="-8" r="2.6" fill="#ffc0c8" opacity="0.75"/>
    <circle cx="12" cy="-18" r="2" fill="#fff" opacity="0.5"/>
    <circle cx="6" cy="10" r="2.2" fill="#ff9098" opacity="0.55"/>
  </g>

  <!-- silver axle THROUGH hearts -->
  <ellipse cx="355" cy="138" rx="11" ry="34" fill="url(#s)" stroke="#3a4250" stroke-width="1.4"/>
  <ellipse cx="355" cy="138" rx="4.5" ry="15" fill="#1a1a1a"/>
  <ellipse cx="355" cy="118" rx="3.5" ry="5" fill="#fff" opacity="0.4"/>

  <!-- FRONT heart disc -->
  <g transform="translate(380 148) rotate(5) scale(1.22,1.42)">
    <ellipse cx="9" cy="0" rx="11" ry="56" fill="url(#he)"/>
    <path d="M0 50 C0 50 -44 12 -44 -14 C-44 -36 -28 -48 -14 -48 C-4 -48 0 -36 0 -28 C0 -36 4 -48 14 -48 C28 -48 44 -36 44 -14 C44 12 0 50 0 50 Z"
          fill="url(#hf)" stroke="#380810" stroke-width="2"/>
    <path d="M0 -28 C-6 -38 6 -38 0 -28" fill="#600810" opacity="0.45"/>
    <circle cx="-14" cy="-6" r="3.2" fill="#ffc0c8" opacity="0.85"/>
    <circle cx="16" cy="-20" r="2.6" fill="#fff" opacity="0.6"/>
    <circle cx="8" cy="12" r="2.8" fill="#ff9098" opacity="0.65"/>
    <circle cx="-6" cy="22" r="2.2" fill="#fff" opacity="0.4"/>
    <circle cx="0" cy="0" r="2" fill="#ffe8ec" opacity="0.5"/>
    <path d="M-22 0 L-8 -22" stroke="#ffd0d8" stroke-width="1.2" opacity="0.35"/>
  </g>

  <!-- ===== TALL ARMS (behind weapon / mid-chassis) ===== -->
  <g>
    <rect x="150" y="198" width="28" height="18" rx="2.5" fill="url(#au)" stroke="#5a4010"/>
    <circle cx="159" cy="207" r="2.2" fill="#2a323c"/><circle cx="169" cy="207" r="2.2" fill="#2a323c"/>
    <path d="M164 200 L152 30" stroke="#1a1a1a" stroke-width="11" stroke-linecap="round"/>
    <path d="M164 200 L152 30" stroke="#3a3a44" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/>
    <rect x="142" y="90" width="20" height="14" rx="2" fill="url(#au)" stroke="#5a4010" transform="rotate(-5 152 97)"/>
    <!-- red two-tine fork -->
    <path d="M142 34 L130 -4 L142 10 L150 34 Z" fill="#d40000" stroke="#480810" stroke-width="1.2"/>
    <path d="M150 34 L162 -8 L174 8 L162 34 Z" fill="#d40000" stroke="#480810" stroke-width="1.2"/>
  </g>
  <g>
    <rect x="228" y="192" width="28" height="18" rx="2.5" fill="url(#au)" stroke="#5a4010"/>
    <circle cx="237" cy="201" r="2.2" fill="#2a323c"/><circle cx="247" cy="201" r="2.2" fill="#2a323c"/>
    <path d="M242 194 L262 22" stroke="#1a1a1a" stroke-width="11" stroke-linecap="round"/>
    <path d="M242 194 L262 22" stroke="#3a3a44" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/>
    <rect x="250" y="78" width="20" height="14" rx="2" fill="url(#au)" stroke="#5a4010" transform="rotate(8 260 85)"/>
    <path d="M250 28 L238 -12 L250 4 L258 28 Z" fill="#d40000" stroke="#480810" stroke-width="1.2"/>
    <path d="M258 28 L272 -16 L286 -2 L272 28 Z" fill="#d40000" stroke="#480810" stroke-width="1.2"/>
  </g>
</svg>
